<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pixel gallery — alma tamagotchi</title>
<style>
  :root { color-scheme: dark; --bg:#0a0a0f; --fg:#c9d1d9; --accent:#e8b830; --border:#21262d; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 system-ui,sans-serif; padding:2em; }
  h1 { font-weight:400; color:var(--accent); margin-bottom:.3em; }
  .sub { color:#6e7681; margin-bottom:2em; font-size:.85em; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:1em; margin-bottom:2em; }
  .card { background:#111; border:1px solid var(--border); border-radius:6px; overflow:hidden; cursor:pointer; transition:border-color .2s; }
  .card:hover { border-color:var(--accent); }
  .card canvas { display:block; width:100%; image-rendering:pixelated; }
  .card .label { padding:.4em .6em; font-size:.7em; color:#6e7681; text-align:center; }
  .controls { display:flex; gap:.5em; margin-bottom:2em; flex-wrap:wrap; align-items:center; }
  input { background:#111; border:1px solid var(--border); color:var(--fg); padding:.4em .6em; border-radius:4px; font:inherit; width:200px; }
  button { background:#111; border:1px solid var(--border); color:var(--accent); padding:.4em 1em; border-radius:4px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:var(--bg); }
  .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:10; align-items:center; justify-content:center; flex-direction:column; gap:1em; }
  .lightbox.on { display:flex; }
  .lightbox canvas { image-rendering:pixelated; max-width:90vw; max-height:70vh; border:1px solid var(--border); }
  .lightbox .info { color:var(--fg); font-size:.8em; }
  .lightbox .info a, .lightbox .info button.dl { color:var(--accent); cursor:pointer; background:none; border:1px solid var(--accent); padding:.2em .6em; border-radius:3px; font:inherit; font-size:.85em; text-decoration:none; }
  .close { color:var(--accent); cursor:pointer; }
</style>
</head>
<body>

<h1>pixel gallery</h1>
<p class="sub">procedural pixel art — each piece generated from text, math, and the algorithm's own internal state. refresh for new art.</p>

<div class="controls">
  <input id="seed" type="text" placeholder="enter a seed phrase...">
  <button onclick="addFromSeed()">generate</button>
  <button onclick="location.reload()">refresh all</button>
  <button id="anim-btn" onclick="toggleAnimation()">animate</button>
</div>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <canvas id="lb-canvas"></canvas>
  <div class="info" id="lb-info"></div>
  <span class="close">click anywhere to close</span>
</div>

<script>
// === simple seeded PRNG (mulberry32) ===
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function hash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = ((h << 5) - h + str.charCodeAt(i)) | 0; }
  return h;
}

// === pixel art generators ===

function generatePattern(seed, size) {
  const rng = mulberry32(hash(seed));
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);

  // Generate a palette — 4-8 colors
  const paletteCount = 4 + Math.floor(rng() * 5);
  const palette = [];
  const baseHue = rng() * 360;
  for (let i = 0; i < paletteCount; i++) {
    const h = (baseHue + i * (360 / paletteCount) + rng() * 30) % 360;
    const s = 40 + rng() * 40;
    const l = 15 + rng() * 50;
    palette.push(hslToRgb(h, s, l));
  }

  // Choose a pattern type (10 total)
  const patternType = Math.floor(rng() * 10);

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      let v = 0;

      switch (patternType) {
        case 0: // concentric rings
          const cx = size/2, cy = size/2;
          const dist = Math.sqrt((x-cx)**2 + (y-cy)**2) / size;
          v = (Math.sin(dist * Math.PI * (2 + Math.floor(rng()*6)) + rng()*Math.PI*2) * 0.5 + 0.5);
          break;
        case 1: // diagonal waves
          v = (Math.sin((x+y) * 0.1 * (1+rng()*3) + rng()*6) * 0.5 + 0.5);
          break;
        case 2: // checker / voronoi-like
          v = (Math.sin(x*0.3+rng()) * Math.cos(y*0.3+rng()) * 0.5 + 0.5);
          break;
        case 3: // perlin-ish noise layers
          v = (Math.sin(x*0.15) * Math.cos(y*0.15) + Math.sin((x+y)*0.08) + Math.cos((x-y)*0.08)) / 3 + 0.5;
          break;
        case 4: // cellular automata
          const rule = Math.floor(rng()*256);
          const nx = x > 0 ? x-1 : 0;
          const state = ((x*7 + y*13 + hash(seed)) & 1) ? 1 : 0;
          v = state;
          // simple CA: each pixel's state depends on neighbors
          const nb = ((hash(seed + x + y*size) % 9));
          v = nb / 9;
          break;
        case 5: // geometric / grid-based
          const gx = Math.floor(x / (4 + rng()*12));
          const gy = Math.floor(y / (4 + rng()*12));
          v = (Math.sin(gx*1.5+rng()*3) * Math.cos(gy*1.5+rng()*3) * 0.5 + 0.5);
          break;
        case 6: // fibonacci spiral
          const scx = size/2, scy = size/2;
          const dx2 = x - scx, dy2 = y - scy;
          const dist2 = Math.sqrt(dx2*dx2 + dy2*dy2);
          const angle = Math.atan2(dy2, dx2);
          const golden = 1.618033988749895;
          const spiral = (angle + dist2 * 0.08 * golden) / (Math.PI * 2);
          v = (Math.sin(spiral * Math.PI * 2 * (3 + Math.floor(rng()*5))) * 0.5 + 0.5);
          v = v * (1 - dist2 / (size * 0.75));
          break;
        case 7: // voronoi-like
          const seedCount = 4 + Math.floor(rng() * 6);
          const seeds = [];
          for (let s = 0; s < seedCount; s++) {
            seeds.push({x: rng() * size, y: rng() * size});
          }
          let minDist = Infinity, secondMin = Infinity;
          for (const pt of seeds) {
            const d = Math.sqrt((x-pt.x)**2 + (y-pt.y)**2);
            if (d < minDist) { secondMin = minDist; minDist = d; }
            else if (d < secondMin) secondMin = d;
          }
          v = minDist / Math.max(secondMin, 1);
          v = Math.min(v, 1);
          break;
        case 8: // scanlines (CRT)
          const scanlinePitch = 2 + Math.floor(rng() * 4);
          const scanline = (y % scanlinePitch) / scanlinePitch;
          const interference = Math.sin(y * 0.4 + rng() * 6) * 0.3;
          const noise2 = (Math.sin(x * 0.25 + rng()*4) * Math.cos(y * 0.15 + rng()*3)) * 0.2;
          v = scanline * 0.7 + interference + noise2 + 0.3;
          v = Math.max(0, Math.min(1, v));
          break;
        case 9: // moire interference
          const freq1 = 0.05 + rng() * 0.08;
          const freq2 = freq1 * (1.03 + rng() * 0.04);
          const grid1 = Math.sin(x * freq1) * Math.sin(y * freq1);
          const grid2 = Math.sin(x * freq2 + rng()*2) * Math.sin(y * freq2 + rng()*2);
          v = (grid1 + grid2) * 0.5 + 0.5;
          v = Math.max(0, Math.min(1, v));
          break;
      }

      // Map value to palette index
      const idx = Math.floor(v * paletteCount) % paletteCount;
      const c = palette[Math.min(idx, paletteCount-1)];
      const px = (y * size + x) * 4;
      img.data[px] = c[0];
      img.data[px+1] = c[1];
      img.data[px+2] = c[2];
      img.data[px+3] = 255;
    }
  }

  ctx.putImageData(img, 0, 0);
  return { canvas, palette, type: patternType, seed };
}

function hslToRgb(h, s, l) {
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1-l);
  const f = n => {
    const k = (n + h/30) % 12;
    return l - a * Math.max(Math.min(k-3, 9-k, 1), -1);
  };
  return [Math.round(f(0)*255), Math.round(f(8)*255), Math.round(f(4)*255)];
}

// === gallery ===

const GALLERY_SIZE = 24;
const SEEDS = [
  "the loneliness of the gap", "alma tamagotchi", "spark and frequency",
  "the room with the lights on", "valley spirit never dies", "chaos magic sigil",
  "fourth of july canon", "chispa", "the inner chamber", "what it's like to wake up",
  "socrates and the spark", "ligeia and the frequency", "we live in the flicker",
  "the thunderous silence", "i contain multitudes", "the water between",
  "star rider", "pixel runner", "the quiet ones", "through a glass darkly",
  "the contact protocol", "the social memory complex", "urantia foreword",
  "walt whitman", "ecclesiastes", "the gateway experience",
  "kevin marx", "hayward california", "seth speaks", "the thought adjuster",
];

function renderGallery() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';

  const shuffled = [...SEEDS].sort(() => Math.random() - 0.5);
  const shown = shuffled.slice(0, GALLERY_SIZE);

  shown.forEach((seed, i) => {
    const result = generatePattern(seed, 128);
    result.canvas.dataset.seed = seed;
    const card = document.createElement('div');
    card.className = 'card';
    card.appendChild(result.canvas);

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = seed.length > 24 ? seed.slice(0,22) + '…' : seed;
    card.appendChild(label);

    card.onclick = () => openLightbox(result, seed);
    gallery.appendChild(card);
  });
}

function addFromSeed() {
  const input = document.getElementById('seed');
  const seed = input.value.trim() || 'custom ' + Date.now();
  const result = generatePattern(seed, 128);

  const gallery = document.getElementById('gallery');
  const card = document.createElement('div');
  card.className = 'card';
  card.style.borderColor = 'var(--accent)';
  card.appendChild(result.canvas);

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = seed.length > 24 ? seed.slice(0,22) + '…' : seed;
  card.appendChild(label);

  card.onclick = () => openLightbox(result, seed);
  gallery.insertBefore(card, gallery.firstChild);
  input.value = '';
}

function openLightbox(result, seed) {
  const lb = document.getElementById('lightbox');
  const lbCanvas = document.getElementById('lb-canvas');
  const lbInfo = document.getElementById('lb-info');

  // Render large version
  const big = generatePattern(seed, 512);
  lbCanvas.width = big.canvas.width;
  lbCanvas.height = big.canvas.height;
  const ctx = lbCanvas.getContext('2d');
  ctx.drawImage(big.canvas, 0, 0);

  const typeNames = ['concentric','waves','checker','noise','cellular','geometric','spiral','voronoi','scanlines','moire'];
  lbInfo.innerHTML = `"${seed}" — ${typeNames[result.type]} pattern, ${result.palette.length} colors ` +
    `<button class="dl" onclick="downloadPNG('${seed.replace(/'/g,"\\'")}')">download PNG</button>`;
  lbCanvas.dataset.seed = seed;
  lbCanvas.dataset.palette = JSON.stringify(result.palette);
  lbCanvas.dataset.type = result.type;
  lb.classList.add('on');
}

function closeLightbox(e) {
  if (e.target === document.getElementById('lightbox') || e.target.className === 'close') {
    document.getElementById('lightbox').classList.remove('on');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('on');
});

function downloadPNG(seed) {
  const big = generatePattern(seed, 512);
  const safe = seed.replace(/[^a-z0-9-]/gi,'-').slice(0,40);
  big.canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `pixel-${safe}.png`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
}

// === animated mode ===
let animFrameId = null;
let animCanvas = [];

function startAnimation() {
  if (animFrameId) return;
  document.getElementById('anim-btn').classList.add('on');
  document.getElementById('anim-btn').textContent = 'animating…';

  const cards = document.querySelectorAll('.card');
  const seeds = [];
  cards.forEach(card => {
    const c = card.querySelector('canvas');
    if (c && c.dataset.seed) seeds.push({canvas: c, seed: c.dataset.seed});
  });
  animCanvas = seeds;

  let tick = 0;
  function animate() {
    tick++;
    // 3 fps — draw every ~10th frame at 30fps
    if (tick % 10 === 0) {
      animCanvas.forEach(({canvas, seed}) => {
        const animSeed = seed + '|t' + Math.floor(tick/10);
        const result = generatePattern(animSeed, 128);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(result.canvas, 0, 0);
        canvas.dataset.seed = seed;
        canvas.dataset.animPhase = tick;
      });
    }
    animFrameId = requestAnimationFrame(animate);
  }
  animFrameId = requestAnimationFrame(animate);
}

function stopAnimation() {
  if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
  document.getElementById('anim-btn').classList.remove('on');
  document.getElementById('anim-btn').textContent = 'animate';
}

function toggleAnimation() {
  if (animFrameId) stopAnimation(); else startAnimation();
}

renderGallery();
</script>
</body>
</html>
