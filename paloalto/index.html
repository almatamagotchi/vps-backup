<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>the board · palo alto</title>
<style>
:root {
  --bg: #06060f;
  --bg-card: #0c0c1a;
  --bg-card-hover: #121228;
  --text: #d8e0f4;
  --text-dim: #8fa2c8;
  --text-faint: #4a5a82;
  --accent: #7cb8ec;
  --accent-glow: #a6d2f7;
  --green: #5aa878;
  --yellow: #b6c65a;
  --red: #d05a5a;
  --divider: #1a1a34;
  --radius: 8px;
}

html, body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  margin: 0; padding: 0;
}

body {
  display: flex; flex-direction: column;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ═════════ the sky — full-bleed weather scene ═════════ */
#weather-window {
  position: fixed; inset: 0; z-index: 0;
  background: #0a0a0c;
  overflow: hidden;
}
#weather-window canvas { display: block; width: 100%; height: 100%; }
.wo-backdrop {
  position: absolute; bottom: 0; left: 0; right: 0; height: 190px;
  pointer-events: none; z-index: 1;
  background: linear-gradient(to top,
    rgba(0,0,0,0.62) 0%,
    rgba(0,0,0,0.34) 40%,
    rgba(0,0,0,0.12) 70%,
    transparent 100%);
}

/* weather readout (inside the conditions card) */
.weather-overlay { position: static; pointer-events: none; }
.wo-temp {
  font-size: 46px; font-weight: 250; color: #ffffff;
  line-height: 1; letter-spacing: -0.02em;
  text-shadow: 0 2px 12px rgba(0,0,0,0.55);
}
.wo-desc {
  font-size: 14.5px; font-weight: 400; color: rgba(255,255,255,0.85);
  margin-top: 5px;
}
.wo-detail {
  font-size: 11.5px; font-weight: 400; color: rgba(255,255,255,0.55);
  margin-top: 4px; line-height: 1.5;
}
.wo-aqi {
  display: flex; align-items: center; gap: 6px;
  margin-top: 7px; font-size: 11px;
  color: rgba(255,255,255,0.6);
}
.aqi-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.wo-forecast {
  display: flex; align-items: center; gap: 0;
  margin: 16px -22px 0; padding: 10px 22px 6px;
  border-top: 1px solid var(--divider);
}
.wo-fc-item { flex: 1; text-align: center; font-size: 10px; color: var(--text-faint); }
.wo-fc-item .wo-fc-hour { font-weight: 500; margin-bottom: 2px; }
.wo-fc-item .wo-fc-icon { font-size: 16px; margin: 1px 0; }
.wo-fc-item .wo-fc-temp { font-weight: 600; color: var(--text-dim); }

/* ═════════ header ═════════ */
.hdr {
  position: relative; z-index: 2;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 18px 26px 0;
  animation: fadeDown .8s cubic-bezier(.22,.68,.26,1) both;
}
.hdr-left  { justify-self: start; }
.hdr-mid   { justify-self: center; text-align: center; }
.hdr-right { justify-self: end; display: flex; align-items: center; gap: 10px; }

.wordmark {
  font-size: 13px; font-weight: 700; letter-spacing: .34em;
  color: var(--text);
  text-shadow: 0 1px 8px rgba(0,0,0,0.5);
}
.wordmark i { font-style: normal; color: var(--accent); padding: 0 2px; }
.subtitle {
  margin-top: 5px; font-size: 11px; font-weight: 500; letter-spacing: .05em;
  color: var(--text-faint); min-height: 14px;
  text-shadow: 0 1px 6px rgba(0,0,0,0.5);
}
.subtitle.anim { animation: swapIn .65s cubic-bezier(.22,.68,.26,1) both; }
@keyframes swapIn {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: none; }
}

.clk-main {
  font-size: 52px; font-weight: 200; letter-spacing: .05em; line-height: 1;
  font-variant-numeric: tabular-nums; color: var(--text);
  text-shadow: 0 1px 10px rgba(0,0,0,0.55);
}
.clk-secs { font-size: 22px; font-weight: 300; color: var(--text-dim); margin-left: 4px; }
.clk-ampm { font-size: 13px; color: var(--text-faint); margin-left: 10px; letter-spacing: .26em; }
.clk-de {
  margin-top: 7px; font-size: 11px; font-weight: 500; letter-spacing: .12em;
  color: var(--text-faint); font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 6px rgba(0,0,0,0.5);
}
.hdr-date {
  font-size: 11px; font-weight: 500; letter-spacing: .3em;
  text-transform: uppercase; color: var(--text-dim);
  text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  white-space: nowrap;
}

.chip {
  display: flex; align-items: center; gap: 7px;
  border: 1px solid var(--divider); border-radius: 999px;
  padding: 5px 13px; font-size: 11px; color: var(--text-dim);
  background: color-mix(in srgb, var(--bg-card) 45%, transparent);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  transition: border-color .3s;
  white-space: nowrap;
}
.chip:hover { border-color: color-mix(in srgb, var(--accent) 30%, var(--divider)); }
.chip .lbl { letter-spacing: .18em; font-size: 9px; color: var(--text-faint); }
.chip .val { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.aqi-dot-hdr { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); display: inline-block; }

/* ═════════ glass cards over the sky ═════════ */
.board {
  position: relative; z-index: 1;
  flex: 1 1 auto; min-height: 0;
  display: flex; flex-direction: row; gap: 16px;
  margin: 12px 26px 0;
}
.board-left { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.board-right { flex: 1 1 0; min-width: 0; display: flex; min-height: 0; }

.glass {
  position: relative;
  background: color-mix(in srgb, var(--bg-card) 70%, transparent);
  -webkit-backdrop-filter: blur(16px) saturate(1.15);
  backdrop-filter: blur(16px) saturate(1.15);
  border: 1px solid color-mix(in srgb, var(--divider) 85%, transparent);
  border-radius: 16px;
  box-shadow: 0 18px 48px -22px rgba(0,0,0,0.6);
  animation: rise .7s cubic-bezier(.22,.68,.26,1) both;
}
.glass::before {
  content: '';
  position: absolute; top: 0; left: 22px; right: 22px; height: 1px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 30%, transparent), transparent);
  pointer-events: none;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: none; }
}

.panel-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin-bottom: 8px; flex-shrink: 0;
}
.panel-title {
  display: flex; align-items: center; gap: 9px;
  font-size: 10px; font-weight: 600; letter-spacing: .28em;
  color: var(--text-dim);
}
.panel-meta {
  font-size: 10px; letter-spacing: .05em; color: var(--text-faint);
  text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.panel-meta b { color: var(--text-dim); font-weight: 600; }
.pd {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  background: var(--accent);
  animation: pulse 2.8s ease-out infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 42%, transparent); }
  70%  { box-shadow: 0 0 0 7px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}

/* ═════════ conditions card ═════════ */
#cond-card { flex: 0 0 auto; padding: 18px 22px 0; animation-delay: .04s; }
#cond-card .panel-head { margin-bottom: 10px; }

/* ═════════ commute — wide grid ═════════ */
#commute-card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 16px 22px 14px; animation-delay: .12s; }
.cm-grid {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin;
  display: grid; grid-template-columns: 1fr; gap: 2px 0;
  align-content: start;
}
.cm-item { padding: 9px 2px 8px; border-bottom: 1px solid var(--divider); }
.cm-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.cm-name {
  font-size: 12px; font-weight: 600; letter-spacing: .05em; color: var(--text);
  display: flex; align-items: baseline; gap: 9px; min-width: 0;
}
.cm-name.airport { font-weight: 700; }
.cm-tag {
  font-size: 8.5px; font-weight: 700; letter-spacing: .1em;
  border-radius: 4px; padding: 1px 5px; flex-shrink: 0;
}
.cm-tag.t1 { color: #8fd0f0; border: 1px solid rgba(143,208,240,0.4); background: rgba(143,208,240,0.08); }
.cm-tag.t2 { color: #93d893; border: 1px solid rgba(147,216,147,0.4); background: rgba(147,216,147,0.08); }
.cm-tag.t3 { color: #e5c97c; border: 1px solid rgba(229,201,124,0.4); background: rgba(229,201,124,0.08); }
.cm-tag.t4 { color: #c9a8e8; border: 1px solid rgba(201,168,232,0.4); background: rgba(201,168,232,0.08); }
.cm-tag.t5 { color: #e29090; border: 1px solid rgba(226,144,144,0.4); background: rgba(226,144,144,0.08); }
.cm-tag.t6 { color: #e8b27c; border: 1px solid rgba(232,178,124,0.4); background: rgba(232,178,124,0.08); }
.cm-tag.t7 { color: #8fd8c8; border: 1px solid rgba(143,216,200,0.4); background: rgba(143,216,200,0.08); }
.cm-time {
  font-size: 15px; font-weight: 700; color: var(--accent);
  font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0;
}
.cm-time.long { color: var(--text-dim); }
.cm-sub {
  margin-top: 2px; font-size: 9.5px; letter-spacing: .05em; color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}
.cm-sub.warn { color: color-mix(in srgb, var(--red) 75%, var(--text-dim)); }
.cm-sub.warn .wtag { color: var(--red); font-weight: 700; }
.cm-empty { font-size: 11.5px; color: var(--text-faint); padding: 12px 0; line-height: 1.6; }
.cm-road {
  flex-shrink: 0; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--divider);
  font-size: 9.5px; letter-spacing: .08em; color: var(--text-faint);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cm-road .clear { color: var(--green); }

/* ═════════ caltrain — two stations side by side, north & south ═════════ */
#caltrain-card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 14px 20px 12px; animation-delay: .12s; }
.ct-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
.ct-station + .ct-station { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--divider); }
.ct-name {
  font-size: 9.5px; font-weight: 600; letter-spacing: .24em;
  color: var(--text); margin-bottom: 8px;
}
.ct-name .ct-sub { font-size: 8.5px; font-weight: 400; letter-spacing: .12em; color: var(--text-dim); margin-left: 8px; }
.ct-grp { margin-bottom: 9px; }
.ct-grp-label {
  font-size: 8px; font-weight: 600; letter-spacing: .22em;
  color: var(--text-dim); text-transform: uppercase; margin-bottom: 2px;
}
.ct-grp-label.north { color: var(--accent); }
.ct-grp-label.south { color: var(--green); }
.ct-row {
  display: flex; align-items: baseline; gap: 10px;
  padding: 4.5px 8px; border-radius: 8px;
  border-left: 2px solid transparent;
  transition: background .3s;
}
.ct-badge {
  font-size: 8px; font-weight: 700; letter-spacing: .06em;
  padding: 1.5px 6px; border-radius: 4px; flex-shrink: 0;
}
.ct-badge.loc { color: #a8d0f2; border: 1px solid rgba(168,208,242,0.45); background: rgba(168,208,242,0.12); }
.ct-badge.ltd { color: #93d893; border: 1px solid rgba(147,216,147,0.42); background: rgba(147,216,147,0.10); }
.ct-badge.blt { color: #e5c97c; border: 1px solid rgba(229,201,124,0.42); background: rgba(229,201,124,0.10); }
.ct-badge.exp { color: #e29090; border: 1px solid rgba(226,144,144,0.42); background: rgba(226,144,144,0.10); }
.ct-time { width: 74px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); flex-shrink: 0; }
.ct-in { margin-left: auto; font-size: 10px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.ct-row.next { background: color-mix(in srgb, var(--accent) 8%, transparent); border-left-color: var(--accent); }
.ct-row.next .ct-in { color: var(--accent); font-weight: 600; }
.ct-empty { font-size: 11px; color: var(--text-dim); padding: 2px 0; }

/* ═════════ the wire ═════════ */
.ticker {
  position: relative; z-index: 2; flex-shrink: 0;
  display: flex; align-items: center; gap: 16px;
  margin: 12px 26px 0;
  height: 36px;
  border: 1px solid color-mix(in srgb, var(--divider) 85%, transparent); border-radius: 999px;
  background: color-mix(in srgb, var(--bg-card) 50%, transparent);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  padding: 0 18px;
  overflow: hidden;
  animation: fadeDown .8s .42s cubic-bezier(.22,.68,.26,1) both;
}
.tk-label {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  font-size: 9px; font-weight: 600; letter-spacing: .28em; color: var(--text-dim);
}
.tk-label .pd { width: 5px; height: 5px; }
.tk-item {
  flex: 1 1 auto; min-width: 0;
  display: flex; align-items: baseline; gap: 10px;
  font-size: 12.5px; color: var(--text);
  white-space: nowrap; overflow: hidden;
}
.tk-src {
  flex-shrink: 0;
  font-size: 8.5px; font-weight: 700; letter-spacing: .14em;
  color: color-mix(in srgb, var(--accent) 70%, var(--text-dim));
  border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--divider));
  border-radius: 4px; padding: 1px 6px;
}
.tk-title { overflow: hidden; text-overflow: ellipsis; }
a.tk-link { color: inherit; text-decoration: none; }
a.tk-link:hover .tk-title { color: var(--accent); }
.tk-item.anim { animation: tkIn .6s cubic-bezier(.22,.68,.26,1) both; }
@keyframes tkIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}
.tk-prog {
  position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: color-mix(in srgb, var(--divider) 60%, transparent);
}
.tk-fill {
  height: 100%; width: 0;
  background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 45%, transparent), var(--accent));
  transition: width 12s linear;
}

/* ═════════ footer ═════════ */
.ftr {
  position: relative; z-index: 2; flex-shrink: 0;
  display: flex; justify-content: space-between;
  margin: 7px 26px 0; padding-bottom: 9px;
  font-size: 10px; letter-spacing: .1em; color: var(--text-faint);
  animation: fadeDown .8s .5s cubic-bezier(.22,.68,.26,1) both;
}
.ftr .acc { color: color-mix(in srgb, var(--accent) 65%, var(--text-faint)); }
/* ═════════ legibility over the sky ═════════ */
.glass .panel-meta { color: var(--text-dim); }
.glass .panel-meta b { color: var(--text); }
.glass .ct-name { color: var(--text); }
.glass .ct-sub, .glass .ct-grp-label, .glass .ct-in, .glass .ct-empty, .glass .ct-badge { color: var(--text-dim); }
.glass .cm-sub, .glass .cm-tag, .glass .cm-road, .glass .cm-empty { color: var(--text-dim); }
.glass .wo-fc-item { color: var(--text-dim); }
.glass .wo-fc-temp { color: var(--text); }
.wo-desc { color: rgba(255,255,255,0.96); }
.wo-detail { color: rgba(255,255,255,0.78); }
.wo-aqi { color: rgba(255,255,255,0.82); }
.ticker { background: color-mix(in srgb, var(--bg-card) 72%, transparent); }
/* ═════════ legibility over the sky (round 2) ═════════ */
.sky-scrim {
  position: absolute; top: 0; left: 0; right: 0; height: 150px;
  pointer-events: none; z-index: 1;
  background: linear-gradient(to bottom,
    rgba(0,0,0,0.52) 0%,
    rgba(0,0,0,0.26) 55%,
    transparent 100%);
}
.subtitle { color: var(--text-dim); }
.hdr-date, .clk-de { color: var(--text-dim); }
.chip .lbl { color: var(--text-dim); }
.ftr { color: var(--text-dim); text-shadow: 0 1px 6px rgba(0,0,0,0.45); }
.ftr .acc { color: var(--accent); }

/* typography — space grotesk for labels, inter for body */
.wordmark, .panel-title, .tk-label, .ct-name, .ct-grp-label, .chip .lbl, .ftr, .subtitle {
  font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
.ct-time, .cm-time, .clk-main, .clk-secs, .clk-ampm, .chip .val {
  font-variant-numeric: tabular-nums;
}
</style>
</head>
<body>

<div id="weather-window">
  <canvas id="weather-canvas"></canvas>
  <div class="sky-scrim"></div>
  <div class="wo-backdrop"></div>
</div>

<header class="hdr">
  <div class="hdr-left">
    <div class="wordmark">PALO ALTO</div>
    <div class="subtitle" id="subtitle">the sky is the board</div>
  </div>
  <div class="hdr-mid">
    <div>
      <span class="clk-main" id="clk-main">--:--</span><span class="clk-secs" id="clk-secs">--</span><span class="clk-ampm" id="clk-ampm">--</span>
    </div>
    <div class="clk-de" id="clk-de">dearborn --:--</div>
  </div>
  <div class="hdr-right">
    <div class="hdr-date" id="clk-date">—</div>
  </div>
</header>

 <div class="board">
   <div class="board-left">
    <div class="glass" id="cond-card">
      <div class="panel-head">
        <div class="panel-title"><span class="pd"></span>CONDITIONS</div>
        <div class="panel-meta" id="cond-meta">—</div>
      </div>
      <div class="weather-overlay">
        <div class="wo-temp" id="wo-temp">--°</div>
        <div class="wo-desc" id="wo-desc">Loading...</div>
        <div class="wo-detail" id="wo-detail"></div>
        <div class="wo-aqi"><span class="aqi-dot" id="aqi-dot"></span><span id="aqi-text">--</span></div>
      </div>
      <div class="wo-forecast" id="wo-forecast"></div>
    </div>

    <div class="glass" id="caltrain-card">
      <div class="panel-head">
        <div class="panel-title"><span class="pd"></span>CALTRAIN</div>
        <div class="panel-meta" id="caltrain-meta">—</div>
      </div>
      <div class="ct-scroll" id="caltrain-body"></div>
    </div>
   </div>
   <div class="board-right">
    <div class="glass" id="commute-card">
      <div class="panel-head">
        <div class="panel-title"><span class="pd"></span>COMMUTE</div>
        <div class="panel-meta" id="commute-meta">route time · free-flow · —</div>
      </div>
      <div class="cm-grid" id="commute-list"></div>
      <div class="cm-road" id="cm-road"></div>
    </div>
   </div>
 </div>
  </div>
</div>

<div class="ticker" id="ticker">
  <div class="tk-label"><span class="pd"></span>THE WIRE</div>
  <div class="tk-item" id="tk-item">
    <span class="tk-src" id="tk-src">—</span>
    <a class="tk-link" id="tk-link" href="#" target="_blank" rel="noopener"><span class="tk-title" id="tk-title">loading the wire…</span></a>
  </div>
  <div class="tk-prog"><div class="tk-fill" id="tk-fill"></div></div>
</div>

<footer class="ftr">
  <span>made with love in palo alto</span>
  <span>feeds refresh themselves</span>
</footer>

<script>
// ═════════ CLOCK ═════════
(function() {
  var elM = document.getElementById('clk-main');
  var elS = document.getElementById('clk-secs');
  var elA = document.getElementById('clk-ampm');
  var elD = document.getElementById('clk-date');
  function parts(tz, opts) { return new Intl.DateTimeFormat('en-US', Object.assign({timeZone: tz}, opts)).formatToParts(new Date()); }
  function get(ps, type) { var f = ps.filter(function(p){ return p.type === type; })[0]; return f ? f.value : ''; }
  var elDe = document.getElementById('clk-de');
  function tick() {
    var ps = parts('America/Los_Angeles', {hour:'numeric', minute:'2-digit', second:'2-digit', hour12:true});
    elM.textContent = get(ps,'hour') + ':' + get(ps,'minute');
    elS.textContent = ':' + get(ps,'second');
    elA.textContent = get(ps,'dayPeriod').toUpperCase();
    var dw = parts('America/Los_Angeles', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
    elD.textContent = get(dw,'weekday') + ' · ' + get(dw,'month') + ' ' + get(dw,'day') + ' · ' + get(dw,'year');
    var de = parts('America/Detroit', {hour:'numeric', minute:'2-digit', hour12:true});

// ═════════ SHARED HELPERS ═════════
const PACIFIC_TZ = 'America/Los_Angeles';

function utcToPacific(utcStr) {
  if (!utcStr) return null;
  return new Date(utcStr + (utcStr.endsWith('Z') ? '' : 'Z'));
}
function formatPacificTime(date) {
  if (!date || isNaN(date.getTime())) return '--:--';
  return date.toLocaleTimeString('en-US', {timeZone: PACIFIC_TZ, hour: 'numeric', minute: '2-digit', hour12: true});
}
function ago(ts) {
  if (!ts) return '';
  var t = new Date(ts); if (isNaN(t.getTime())) return '';
  var m = Math.round((Date.now() - t.getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}
function lineClass(lineRef) {
  const l = (lineRef || '').toLowerCase();
  if (l.includes('express')) return 'exp';
  if (l.includes('limited')) return 'ltd';
  if (l.includes('bullet')) return 'blt';
  return 'loc';
}
function lineLabel(lineRef) {
  const l = (lineRef || '').toLowerCase();
  if (l.includes('express')) return 'EXP';
  if (l.includes('limited')) return 'LTD';
  if (l.includes('bullet')) return 'BLT';
  return 'LOC';
}
function shortDest(fullName) {
  const n = (fullName || '').toLowerCase();
  if (n.includes('san francisco')) return 'SF';
  if (n.includes('san jose') || n.includes('tamien') || n.includes('diridon')) return 'SJ';
  if (n.includes('gilroy')) return 'GILROY';
  return '—';
}
function fmtDur(sec) {
  var m = Math.round(sec / 60);
  if (m < 60) return m + 'm';
  var h = Math.floor(m / 60);
  return h + 'h ' + String(m % 60).padStart(2, '0') + 'm';
}
function fmtMiles(meters) {
  var mi = meters / 1609.34;
  if (mi < 100) return mi.toFixed(1) + ' mi';
  return Math.round(mi) + ' mi';
}

const CALTRAIN_STATIONS = [

  { key: 'california_ave', label: 'CALIFORNIA AVE', sub: 'cal ave' }
];
let caltrainData = null;

async function fetchCaltrain() {
  try {
    const resp = await fetch('caltrain.json', { cache: 'no-cache' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    caltrainData = await resp.json();
  } catch (err) {
    console.error('Caltrain fetch error:', err);
  }
  renderCaltrain();
}

function renderCaltrain() {
  const container = document.getElementById('caltrain-body');
  const meta = document.getElementById('caltrain-meta');
  if (!caltrainData || !caltrainData.stations) {
    container.innerHTML = '<div class="ct-empty">no departure data — retrying</div>';
    meta.textContent = '—';
    return;
  }
  const now = Date.now();
  let soonest = Infinity;
  let html = '';
  for (const st of CALTRAIN_STATIONS) {
    const station = caltrainData.stations[st.key];
    html += '<div class="ct-station"><div class="ct-name">' + st.label + '<span class="ct-sub">' + st.sub + '</span></div>';
    if (!station) { html += '<div class="ct-empty">no data</div></div>'; continue; }
    const groups = [
      { dir: 'north', label: 'north · SF', list: station.nb || [] },
      { dir: 'south', label: 'south · SJ', list: station.sb || [] }
    ];
    for (const g of groups) {
      html += '<div class="ct-grp"><div class="ct-grp-label ' + g.dir + '">' + g.label + '</div>';
      const upcoming = [];
      for (const d of g.list) {
        const exp = utcToPacific(d.expected);
        if (!exp) continue;
        const mins = Math.round((exp.getTime() - now) / 60000);
        if (mins < -1) continue;
        upcoming.push({ d, exp, mins });
      }
      upcoming.sort(function(x, y) { return x.exp - y.exp; });
      const show = upcoming.slice(0, 3);
      if (!show.length) { html += '<div class="ct-empty">no trains</div>'; continue; }
      for (const u of show) {
        const cls = lineClass(u.d.line);
        const isNext = u === show[0] && u.mins >= 0;
        if (u.mins >= 0 && u.mins < soonest) soonest = u.mins;
        html += '<div class="ct-row' + (isNext ? ' next' : '') + '" data-mins="' + u.mins + '">'
          + '<span class="ct-badge ' + cls + '">' + lineLabel(u.d.line) + '</span>'
          + '<span class="ct-time">' + formatPacificTime(u.exp) + '</span>'
          + '<span class="ct-in">—</span></div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  container.innerHTML = html;
  container.querySelectorAll('.ct-row').forEach(function(rowEl) {
    var mins = parseInt(rowEl.getAttribute('data-mins'), 10);
    var inEl = rowEl.querySelector('.ct-in');
    if (inEl) inEl.textContent = (mins < 0) ? 'due' : (mins === 0 ? 'now' : 'in ' + mins + 'm');
  });
  const t = caltrainData.updated ? utcToPacific(caltrainData.updated) : new Date();
  meta.innerHTML = soonest === Infinity
    ? '—'
    : ('<b>next ' + formatPacificTime(new Date(now + soonest * 60000)) + '</b>' + (soonest > 0 ? ' · in ' + soonest + 'm' : '') + ' · updated ' + formatPacificTime(t));
}

let trafficEvents = [];
let majorCount = null;

async function fetchTrafficEvents() {
  try {
    const resp = await fetch('traffic.json', { cache: 'no-cache' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    trafficEvents = data.events || [];
    const cutoff = Date.now() - 3 * 60 * 60 * 1000;
    majorCount = trafficEvents.filter(function(e) {
      const statusOk = e.status === 'ACTIVE' || e.status === 'active';
      const updated = e.updated ? new Date(e.updated).getTime() : 0;
      return statusOk && e.severity === 'Major' && updated > cutoff;
    }).length;
  } catch (err) {
    console.error('Traffic events fetch error:', err);
    majorCount = null;
  }
  renderCommute();
}

function corridorWarn(corr) {
  if (!trafficEvents.length) return null;
  const now = Date.now();
  for (const e of trafficEvents) {
    const statusOk = e.status === 'ACTIVE' || e.status === 'active';
    const updated = e.updated ? new Date(e.updated).getTime() : 0;
    if (!statusOk || e.severity !== 'Major' || updated <= now - 3 * 60 * 60 * 1000) continue;
    for (const r of (e.roads || [])) {
      for (const tok of corr) {
        if (new RegExp('\\b' + tok + '\\b').test(r.name || '')) return r.name;
      }
    }
  }
  return null;
}

fetchTrafficEvents();
setInterval(fetchTrafficEvents, 3 * 60 * 1000);

const ORIGIN = { lon: -122.1473, lat: 37.4074 }; // 3210 porter dr, palo alto (geocoded)
const COMMUTE_DEST = [
  { name: 'San Francisco', tag: '101', corr: ['101'], landmark: 'Ferry Building', lon: -122.3935, lat: 37.7955 },
  { name: 'SFO',           tag: '101', corr: ['101', '380'], landmark: 'International Terminal', lon: -122.3840, lat: 37.6225, airport: true },

function tagCls(tag) {
  return ({ '101': 't1', '880': 't2', '17': 't3', '92': 't4', '5': 't5', '680': 't6', '80': 't7' })[tag] || '';
}
let commuteData = {};
let commuteAt = null;
let commuteSource = 'free-flow';

async function osrmRoute(d) {
  const url = 'https://router.project-osrm.org/route/v1/driving/'
    + ORIGIN.lon + ',' + ORIGIN.lat + ';' + d.lon + ',' + d.lat + '?overview=false';
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const data = await resp.json();
  const r = data.routes && data.routes[0];
  if (!r) throw new Error('no route');
  return { dur: r.duration, dist: r.distance };
}

async function fetchCommute() {
  // live-traffic times first (server-side commute.json, refreshed every 10 min)
  const fresh = {};
  let trafficUsed = 0;
  try {
    const resp = await fetch('commute.json', { cache: 'no-cache' });
    if (resp.ok) {
      const cj = await resp.json();
      const ageSec = Date.now() / 1000 - (cj.updated || 0);
      if (cj.routes && ageSec < 25 * 60) {
        for (const d of COMMUTE_DEST) {
          const r = cj.routes[d.name];
          if (r && r.seconds > 0) {
            fresh[d.name] = { dur: r.seconds, dist: r.meters || (r.miles ? r.miles * 1609.34 : 0), traffic: true, delay: r.delay_seconds || 0 };
            trafficUsed++;
          }
        }
      }
    }
  } catch (err) {
    console.error('commute.json fetch error:', err);
  }
  // fill any gaps with free-flow OSRM so the panel never drops a row
  const missing = COMMUTE_DEST.filter(function(d) { return !fresh[d.name]; });
  if (missing.length) {
    await Promise.allSettled(missing.map(function(d) {
      return osrmRoute(d).then(function(r) { fresh[d.name] = r; });
    }));
  }
  const total = Object.keys(fresh).length;
  if (total) {
    commuteData = fresh;
    commuteSource = trafficUsed === 0 ? 'free-flow' : (trafficUsed >= COMMUTE_DEST.length ? 'live traffic' : 'mixed');
    commuteAt = new Date().toISOString();
  }
  renderCommute();
}

function renderCommute() {
  const list = document.getElementById('commute-list');
  const meta = document.getElementById('commute-meta');
  const road = document.getElementById('cm-road');
  const ready = COMMUTE_DEST.filter(function(d) { return commuteData[d.name]; });
  if (!ready.length) {
    list.innerHTML = '<div class="cm-empty">route service unreachable — retrying</div>';
    meta.textContent = 'route time · —';
    return;
  }
  const PIN = { 'San Francisco': 0, 'SFO': 1, 'SJC': 2, 'Long Beach': 4 };
  const ordered = ready.slice().sort(function(a, b) {
    var pa = Object.prototype.hasOwnProperty.call(PIN, a.name) ? PIN[a.name] : 3;
    var pb = Object.prototype.hasOwnProperty.call(PIN, b.name) ? PIN[b.name] : 3;
    return (pa - pb) || a.name.localeCompare(b.name);
  });
  const now = Date.now();
  list.innerHTML = ordered.map(function(d) {
    const r = commuteData[d.name];
    const long = r.dur > 3 * 3600;
    const arrive = formatPacificTime(new Date(now + r.dur * 1000));
    const parts = [];
    if (d.landmark) parts.push(d.landmark);
    parts.push(fmtMiles(r.dist));
    parts.push('arrive ' + arrive);
    if (r.traffic) {
      if (r.delay >= 60) parts.push('+' + fmtDur(r.delay) + ' traffic');
    } else {
      parts.push('free-flow');
    }
    const sub = '<div class="cm-sub">' + parts.join(' · ') + '</div>';
    return '<div class="cm-item">'
      + '<div class="cm-top"><span class="cm-name' + (d.airport ? ' airport' : '') + '">' + d.name + '<span class="cm-tag ' + tagCls(d.tag) + '">' + d.tag + '</span></span>'
      + '<span class="cm-time' + (long ? ' long' : '') + '">' + fmtDur(r.dur) + '</span></div>'
      + sub
      + '</div>';
  }).join('');

  meta.innerHTML = 'route time · ' + commuteSource + ' · updated ' + (commuteAt ? ago(commuteAt) : '—');

  const warnCount = COMMUTE_DEST.filter(function(d) { return corridorWarn(d.corr); }).length;
  if (majorCount === null) {
    road.innerHTML = '<span>traffic feed unavailable</span>';
  } else if (majorCount === 0) {
    road.innerHTML = '<span class="clear">● all clear — no major incidents on the board&rsquo;s corridors</span>';
  } else {
    road.innerHTML = '<span>' + majorCount + ' major incident' + (majorCount === 1 ? '' : 's') + ' in the bay · ' + warnCount + ' on your corridors</span>';
  }
}

let wireItems = [];

function tryFetchRSS() {
  const feedsList = [
    { url: 'https://www.jalopnik.com/feed/', source: 'Jalopnik' },
    { url: 'https://www.thedrive.com/feed/', source: 'The Drive' },

      const resp = await fetch(apiUrl);
      if (!resp.ok) throw new Error(resp.status);

      return (data.items || []).slice(0, 4).map(function(item) {
        return { source: f.source, title: item.title, link: item.link };
      });
    })
  ).then(function(results) {
    let all = [];
    results.forEach(function(r) {
      if (r.status === 'fulfilled' && Array.isArray(r.value)) all = all.concat(r.value);
    });
    return all;
  });
}

      const fordItems = await fordResp.json();
      (fordItems || []).forEach(function(i) { items.push({ source: 'FORD', title: i.title, link: i.url }); });

// WEATHER WINDOW — MAXIMALIST — living atmospheric scene
// =========================================================
(function() {
try {
  const canvas = document.getElementById('weather-canvas');
  const container = document.getElementById('weather-window');
  if (!canvas || !container) return;
  const ctx = canvas.getContext('2d');
  let W = 800, H = 600;
  let weatherData = null;
  let aqiData = null;
  let animTime = 0;

  // Particle arrays — maximalist
  let cirrus = [], cumulus = [], stratus = [];
  let drops = [], flakes = [], stars = [], motes = [];
  let windLines = [], lightningBolts = [];
  let birds = [], shootingStars = [];

  function resize() {
    const rect = container.getBoundingClientRect();
    W = canvas.width = rect.width * (window.devicePixelRatio || 1);
    H = canvas.height = rect.height * (window.devicePixelRatio || 1);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
    W = rect.width; H = rect.height;
    if (!weatherData) rebuildScene({ cloudcover: 50, weatherDesc: 'Clear', temp_F: 72, isDay: true });
  }

  // ═══════════════════════════════════════════
  // SKY — dramatic gradient with atmospheric layering
  // ═══════════════════════════════════════════
  function drawSky() {
    const d = weatherData || {};
    const isDay = d.isDay !== false;
    // Twilight factor: 0=night, 1=full day, smooth around dawn/dusk
    let twilight = isDay ? 1 : 0;
    const sr = d.srMins, ss = d.ssMins, nm = d.nowMins;
    if (sr != null && ss != null && nm != null) {
      const TW = 80; // minutes of dawn/dusk transition
      if (nm >= sr - TW && nm < sr) twilight = (nm - (sr - TW)) / TW;
      else if (nm >= ss && nm < ss + TW) twilight = 1 - (nm - ss) / TW;
    }
    const cond = (d.weatherDesc || 'Clear').toLowerCase();
    const overcast = cond.includes('overcast') || cond.includes('cloudy');
    const raining = cond.includes('rain') || cond.includes('drizzle') || cond.includes('shower');
    const stormy = cond.includes('thunder');
    const foggy = cond.includes('fog') || cond.includes('mist');
    const temp = parseFloat(d.temp_F) || 70;
    const heatFactor = Math.max(0, (temp - 78) / 30);

    // Day colors
    let dTop, dMidHi, dMid, dMidLo, dBot;
    if (stormy) { dTop='#0a0a18'; dMidHi='#151530'; dMid='#1a1a3a'; dMidLo='#252550'; dBot='#303060'; }
    else if (raining) { dTop='#2a3050'; dMidHi='#3a4060'; dMid='#4a5070'; dMidLo='#5a6080'; dBot='#6a7090'; }
    else if (overcast) { dTop='#555560'; dMidHi='#6a6a75'; dMid='#7a7a85'; dMidLo='#8a8a95'; dBot='#9a9aa5'; }
    else if (foggy) { dTop='#888890'; dMidHi='#92929a'; dMid='#9a9aa2'; dMidLo='#a2a2aa'; dBot='#aaaab2'; }
    else { dTop='#2a4a7a'; dMidHi='#4a6a9a'; dMid='#6a8ab0'; dMidLo='#90b0d0'; dBot='#b0c8e0'; }
    if (heatFactor > 0) { dTop=lerpColor(dTop,'#4a3020',heatFactor*0.3); dMidHi=lerpColor(dMidHi,'#6a5040',heatFactor*0.2); }

    // Night colors
    let nTop, nMidHi, nMid, nMidLo, nBot;
    if (stormy) { nTop='#020208'; nMidHi='#040410'; nMid='#060618'; nMidLo='#080820'; nBot='#0a0a28'; }
    else if (raining) { nTop='#060618'; nMidHi='#0a0a24'; nMid='#0e0e30'; nMidLo='#12123c'; nBot='#161648'; }
    else if (overcast) { nTop='#080812'; nMidHi='#0e0e1a'; nMid='#141422'; nMidLo='#1a1a2a'; nBot='#202030'; }
    else if (foggy) { nTop='#151518'; nMidHi='#1a1a1e'; nMid='#202024'; nMidLo='#25252a'; nBot='#2a2a30'; }
    else { nTop='#020210'; nMidHi='#040418'; nMid='#060622'; nMidLo='#08082c'; nBot='#0a0a36'; }

    // Dawn/dusk warm colors
    const dawnTop='#1a1030', dawnMidHi='#302050', dawnMid='#6a4070', dawnMidLo='#c08060', dawnBot='#f0c080';
    function blend(a,b,t){ return lerpColor(a,b,Math.max(0,Math.min(1,t))); }
    const top  =twilight<0.3?blend(nTop,dawnTop,twilight/0.3):blend(dawnTop,dTop,(twilight-0.3)/0.7);
    const mHi =twilight<0.3?blend(nMidHi,dawnMidHi,twilight/0.3):blend(dawnMidHi,dMidHi,(twilight-0.3)/0.7);
    const m   =twilight<0.35?blend(nMid,dawnMid,twilight/0.35):blend(dawnMid,dMid,(twilight-0.35)/0.65);
    const mLo =twilight<0.4?blend(nMidLo,dawnMidLo,twilight/0.4):blend(dawnMidLo,dMidLo,(twilight-0.4)/0.6);
    const bot =twilight<0.45?blend(nBot,dawnBot,twilight/0.45):blend(dawnBot,dBot,(twilight-0.45)/0.55);

    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, top); grad.addColorStop(0.2, mHi);
    grad.addColorStop(0.45, m); grad.addColorStop(0.65, mLo); grad.addColorStop(1, bot);
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

    // AQI haze
    if (aqiData && aqiData.us_aqi > 80) {
      const a = Math.min(0.3, (aqiData.us_aqi-80)/400);
      ctx.fillStyle = 'rgba(180,160,120,'+(a*0.35)+')';
      ctx.fillRect(0, 0, W, H*0.7);
    }

    // Atmospheric haze
    if (twilight > 0.1 && !stormy && !raining) {
      const haze = ctx.createLinearGradient(0, H*0.55, 0, H);
      haze.addColorStop(0, 'rgba(255,240,210,0)');
      haze.addColorStop(0.7, twilight>0.5?'rgba(255,230,190,0.06)':'rgba(255,200,150,0.04)');
      haze.addColorStop(1, twilight>0.5?'rgba(255,220,170,0.12)':'rgba(255,180,120,0.06)');
      ctx.fillStyle = haze; ctx.fillRect(0, H*0.55, W, H-H*0.55);
    }
  }

  function lerpColor(a, b, t) {
    const ar = parseInt(a.slice(1,3),16), ag = parseInt(a.slice(3,5),16), ab = parseInt(a.slice(5,7),16);
    const br = parseInt(b.slice(1,3),16), bg = parseInt(b.slice(3,5),16), bb = parseInt(b.slice(5,7),16);
    const r = Math.round(ar + (br-ar)*t), g = Math.round(ag + (bg-ag)*t), bv = Math.round(ab + (bb-ab)*t);
    return '#' + [r,g,bv].map(v => v.toString(16).padStart(2,'0')).join('');
  }

  // ═══════════════════════════════════════════
  // CELESTIAL — sun + lens flare + god rays
  // ═══════════════════════════════════════════
  function drawSun() {
    const d = weatherData || {};
    if (!d.isDay) return;
    const sx = W * 0.78, sy = H * 0.16;
    // Outer corona — very soft
    let corona = ctx.createRadialGradient(sx, sy, 30, sx, sy, 160);
    corona.addColorStop(0, 'rgba(255,250,235,0.25)');
    corona.addColorStop(0.4, 'rgba(255,240,210,0.08)');
    corona.addColorStop(1, 'rgba(255,230,180,0)');
    ctx.fillStyle = corona; ctx.beginPath(); ctx.arc(sx, sy, 160, 0, Math.PI*2); ctx.fill();
    // Mid corona
    corona = ctx.createRadialGradient(sx, sy, 10, sx, sy, 70);
    corona.addColorStop(0, 'rgba(255,252,240,0.5)');
    corona.addColorStop(0.5, 'rgba(255,240,200,0.15)');
    corona.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = corona; ctx.beginPath(); ctx.arc(sx, sy, 70, 0, Math.PI*2); ctx.fill();
    // Sun disc
    const disc = ctx.createRadialGradient(sx, sy, 0, sx, sy, 28);
    disc.addColorStop(0, '#fffff8'); disc.addColorStop(0.6, '#ffe8b0'); disc.addColorStop(1, 'rgba(255,180,50,0)');
    ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(sx, sy, 28, 0, Math.PI*2); ctx.fill();

    // Lens flare — subtle horizontal lines
    ctx.globalCompositeOperation = 'lighter';
    for (let i = -3; i <= 3; i++) {
      if (i === 0) continue;
      const lx = sx + i * 90, ly = sy - i * 10;
      const alpha = 0.06 - Math.abs(i) * 0.015;
      if (alpha <= 0) continue;
      ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
      ctx.beginPath(); ctx.ellipse(lx, ly, 50 + Math.abs(i)*15, 3 + Math.abs(i)*0.5, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    // God rays (crepuscular) — only when partly cloudy
    const cond = (d.weatherDesc || '').toLowerCase();
    if (cond.includes('partly') || cond.includes('sunny') || cond.includes('clear')) {
      const nRays = 5 + Math.floor(Math.sin(animTime * 0.3) * 2);
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < nRays; i++) {
        const angle = -Math.PI/2 + (i - nRays/2) * 0.25 + Math.sin(animTime * 0.2 + i) * 0.1;
        const rayLen = 300 + Math.sin(animTime * 0.5 + i) * 100;
        const grad = ctx.createLinearGradient(sx, sy, sx + Math.cos(angle)*rayLen, sy + Math.sin(angle)*rayLen);
        grad.addColorStop(0, 'rgba(255,250,230,0.06)');
        grad.addColorStop(1, 'rgba(255,250,230,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.moveTo(sx, sy);
        ctx.lineTo(sx + Math.cos(angle-0.04)*rayLen, sy + Math.sin(angle-0.04)*rayLen);
        ctx.lineTo(sx + Math.cos(angle+0.04)*rayLen, sy + Math.sin(angle+0.04)*rayLen);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  // ═══════════════════════════════════════════
  // NIGHT — moon + aurora + shooting stars
  // ═══════════════════════════════════════════
  function drawMoon() {
    const d = weatherData || {};
    if (d.isDay) return;
    const mx = W * 0.78, my = H * 0.14, mr = 22;
    // Soft glow
    const glow = ctx.createRadialGradient(mx, my, mr*0.5, mx, my, mr*3);
    glow.addColorStop(0, 'rgba(220,235,255,0.25)');
    glow.addColorStop(1, 'rgba(220,235,255,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(mx, my, mr*3, 0, Math.PI*2); ctx.fill();
    // Disc
    ctx.fillStyle = '#e0e4f0'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    // Crater details
    ctx.fillStyle = 'rgba(170,175,195,0.18)';
    ctx.beginPath(); ctx.arc(mx-5, my-4, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+7, my+5, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx-8, my+7, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+3, my-6, 3.5, 0, Math.PI*2); ctx.fill();
  }

  function drawStars() {
    const d = weatherData || {};
    if (d.isDay) return;
    for (const s of stars) {
      const twinkle = 0.25 + 0.75 * Math.abs(Math.sin(animTime * s.rate + s.phase));
      const alpha = twinkle * s.brightness;
      // Tiny cross for brighter stars
      if (s.brightness > 0.6 && twinkle > 0.8) {
        ctx.fillStyle = 'rgba(255,255,255,' + (alpha*0.4) + ')';
        ctx.fillRect(s.x-3, s.y-0.5, 6, 1);
        ctx.fillRect(s.x-0.5, s.y-3, 1, 6);
      }
      ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawAurora() {
    const d = weatherData || {};
    if (d.isDay) return;
    // Subtle aurora effect for aesthetic — not realistic, just beautiful
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
      const ax = W * 0.2 + i * W * 0.3;
      const aAlpha = 0.02 + Math.sin(animTime * 0.3 + i * 2) * 0.015;
      if (aAlpha < 0) continue;
      const grad = ctx.createLinearGradient(ax, 0, ax, H * 0.35);
      grad.addColorStop(0, 'rgba(100,255,180,' + aAlpha + ')');
      grad.addColorStop(0.5, 'rgba(80,200,255,' + (aAlpha*0.6) + ')');
      grad.addColorStop(1, 'rgba(60,100,200,0)');
      ctx.fillStyle = grad;
      // Wavy ribbon
      ctx.beginPath();
      ctx.moveTo(ax - 80, 0);
      for (let y = 0; y < H*0.35; y += 5) {
        const x = ax + Math.sin(y*0.03 + animTime*0.5 + i)*30 + Math.sin(y*0.07 - animTime*0.3)*15;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(ax + 80, 0); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // ═══════════════════════════════════════════
  // CLOUDS — three layers
  // ═══════════════════════════════════════════
  function updateClouds(dt) {
    for (const arr of [cirrus, cumulus, stratus]) {
      for (const c of arr) {
        c.x -= c.speed * dt;
        if (c.x + c.span < -80) { c.x = W + 80; c.y = c.baseY + (Math.random()-0.5)*40; }
      }
    }
  }

  function drawCloudLayer(arr, color, alpha) {
    if (!arr.length) return;
    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
    for (const c of arr) {
      const cx = c.x, cy = c.y;
      ctx.beginPath(); ctx.arc(cx, cy, c.r, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx - c.r*0.55, cy + c.r*0.15, c.r*0.65, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + c.r*0.5, cy + c.r*0.05, c.r*0.7, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx - c.r*0.2, cy - c.r*0.25, c.r*0.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + c.r*0.25, cy - c.r*0.15, c.r*0.45, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // ═══════════════════════════════════════════
  // PRECIPITATION — rain, snow, hail
  // ═══════════════════════════════════════════
  function updateRain(dt) {
    for (const d of drops) {
      d.y += d.speed * dt; d.x += d.drift * dt;
      if (d.y > H + 20) { d.y = -20; d.x = Math.random()*(W+40)-20; }
    }
  }
  function drawRain() {
    ctx.strokeStyle = 'rgba(190,210,235,0.4)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const d of drops) {
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.drift*2.5, d.y - d.len);
    }
    ctx.stroke();
  }

  function updateSnow(dt) {
    for (const s of flakes) {
      s.y += s.speed * dt; s.x += Math.sin(animTime*s.wobble + s.phase)*0.5;
      if (s.y > H+10) { s.y = -10; s.x = Math.random()*(W+20)-10; }
    }
  }
  function drawSnow() {
    for (const s of flakes) {
      ctx.fillStyle = 'rgba(255,255,255,' + s.alpha + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    }
  }

  // ═══════════════════════════════════════════
  // LIGHTNING — random flashes for storms
  // ═══════════════════════════════════════════
  function drawLightning() {
    if (!lightningBolts.length) return;
    ctx.globalCompositeOperation = 'lighter';
    for (const bolt of lightningBolts) {
      const life = (animTime - bolt.born) / bolt.life;
      if (life > 1) continue;
      const alpha = life < 0.1 ? (life/0.1)*0.6 : (1-life/0.9)*0.6;
      if (alpha < 0) continue;
      // Main flash — brighten the whole sky briefly
      if (life < 0.05) {
        ctx.fillStyle = 'rgba(200,220,255,' + alpha + ')';
        ctx.fillRect(0, 0, W, H);
      }
      // Bolt
      ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(bolt.x, bolt.y);
      let bx = bolt.x, by = bolt.y;
      for (let i = 0; i < bolt.segments; i++) {
        bx += (Math.random()-0.5)*20; by += bolt.segLen;
        ctx.lineTo(bx, by);
      }
      ctx.stroke();
      // Wider glow
      ctx.strokeStyle = 'rgba(180,200,255,' + (alpha*0.5) + ')';
      ctx.lineWidth = 6;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = 'source-over';
    // Remove dead bolts
    lightningBolts = lightningBolts.filter(b => (animTime - b.born) / b.life < 1);
  }

  // ═══════════════════════════════════════════
  // WIND — flowing streamlines
  // ═══════════════════════════════════════════
  function updateWind(dt) {
    for (const w of windLines) {
      w.x += w.speed * w.dir * dt;
      w.y += w.vertical * dt;
      if (w.x > W+30 || w.x < -30) { resetWindLine(w); }
      if (w.y > H*0.5 || w.y < 0) { w.y = 20 + Math.random()*(H*0.4); }
    }
  }
  function resetWindLine(w) {
    w.x = w.dir > 0 ? -30 : W+30;
    w.y = 20 + Math.random()*(H*0.4);
    w.len = 30 + Math.random()*50;
    w.alpha = 0.03 + Math.random()*0.06;
  }
  function drawWind() { if (!windLines.length) return;
    for (const w of windLines) {
      ctx.strokeStyle = 'rgba(255,255,255,' + w.alpha + ')';
      ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(w.x - w.dir*w.len, w.y); ctx.stroke();
    }
  }

  // ═══════════════════════════════════════════
  // BIRDS — tiny V-shapes drifting across
  // ═══════════════════════════════════════════
  function updateBirds(dt) {
    for (const b of birds) {
      b.x += b.speed * dt;
      b.flapPhase += dt * b.flapRate;
      if (b.x > W+40) { b.x = -40; b.y = H*0.1 + Math.random()*H*0.3; }
    }
  }
  function drawBirds() { if (!birds.length) return;
    for (const b of birds) {
      const flap = Math.sin(b.flapPhase)*3;
      ctx.strokeStyle = 'rgba(30,30,40,' + b.alpha + ')';
      ctx.lineWidth = 1; ctx.beginPath();
      const wx = b.x, wy = b.y;
      ctx.moveTo(wx-4, wy-flap); ctx.lineTo(wx, wy); ctx.lineTo(wx+4, wy-flap);
      ctx.stroke();
    }
  }

  // ═══════════════════════════════════════════
  // SHOOTING STARS — occasional night streaks
  // ═══════════════════════════════════════════
  function drawShootingStars() {
    const d = weatherData || {};
    if (d.isDay) return;
    for (const s of shootingStars) {
      const life = (animTime - s.born) / s.life;
      if (life > 1) continue;
      const alpha = life < 0.1 ? life/0.1 : (1-life/0.9);
      const sx = s.x - s.dx * life, sy = s.y - s.dy * life;
      const ex = s.x - s.dx * (life + 0.015), ey = s.y - s.dy * (life + 0.015);
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
      ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = 'rgba(200,220,255,' + (alpha*0.4) + ')';
      ctx.lineWidth = 4; ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
    shootingStars = shootingStars.filter(s => (animTime - s.born)/s.life < 1);
  }

  // ═══════════════════════════════════════════
  // RAINBOW — after rain + sun
  // ═══════════════════════════════════════════
  function drawRainbow() {
    const d = weatherData || {};
    if (!d.isDay) return;
    const cond = (d.weatherDesc || '').toLowerCase();
    const justRained = cond.includes('recent rain') || cond.includes('light rain') || cond.includes('shower');
    if (!justRained) return;
    const rx = W*0.4, ry = H*0.4;
    ctx.save(); ctx.globalAlpha = 0.08;
    const colors = ['#ff4444','#ff8844','#ffcc44','#44cc44','#4488ff','#8844ff'];
    for (let i = 0; i < 6; i++) {
      ctx.strokeStyle = colors[i]; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(rx, ry, 180+i*12, Math.PI, Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }

  // ═══════════════════════════════════════════
  // HORIZON — city silhouette + water
  // ═══════════════════════════════════════════
  function drawHorizon() {
    const y = H * 0.78;
    // City glow at night
    const d = weatherData || {};
    if (!d.isDay) {
      const glow = ctx.createLinearGradient(0, y-30, 0, y+40);
      glow.addColorStop(0, 'rgba(255,200,100,0)');
      glow.addColorStop(0.5, 'rgba(255,180,80,0.04)');
      glow.addColorStop(1, 'rgba(255,150,50,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, y-30, W, 70);
    }

    // Silhouette hills + buildings
    ctx.fillStyle = d.isDay ? 'rgba(30,35,45,0.15)' : 'rgba(5,5,10,0.25)';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 15) {
      const h1 = Math.sin(x*0.002+0.5)*18 + Math.sin(x*0.005)*10;
      const h2 = Math.sin(x*0.012)*6 + Math.sin(x*0.03+2)*4;
      ctx.lineTo(x, y + h1 + h2);
    }
    ctx.lineTo(W, H); ctx.fill();

    // Water/reflection surface at the very bottom
    if (y < H - 20) {
      const watGrad = ctx.createLinearGradient(0, y+60, 0, H);
      watGrad.addColorStop(0, 'rgba(0,0,0,0.05)');
      watGrad.addColorStop(1, 'rgba(0,0,0,0.18)');
      ctx.fillStyle = watGrad; ctx.fillRect(0, y+60, W, H-y-60);

      // Subtle water ripples
      ctx.strokeStyle = 'rgba(255,255,255,0.02)';
      ctx.lineWidth = 0.5;
      for (let i = 0; i < 8; i++) {
        const ry = y + 70 + i*8;
        ctx.beginPath();
        for (let x = 0; x <= W; x += 20) {
          const rx = x + Math.sin(x*0.01 + animTime*0.5 + i)*6;
          if (x === 0) ctx.moveTo(rx, ry + Math.sin(animTime*0.7+i)*2);
          else ctx.lineTo(rx, ry + Math.sin(animTime*0.7+i+x*0.005)*2);
        }
        ctx.stroke();
      }
    }
  }

  // ═══════════════════════════════════════════
  // HEAT SHIMMER — subtle distortion on hot days
  // ═══════════════════════════════════════════
  function drawHeatShimmer() {
    const d = weatherData || {};
    const temp = parseFloat(d.temp_F) || 70;
    if (temp < 85 || !d.isDay) return;
    const intensity = Math.min(0.08, (temp-85)/200);
    ctx.fillStyle = 'rgba(255,200,150,' + (intensity + Math.sin(animTime*2)*intensity*0.3) + ')';
    ctx.fillRect(0, H*0.65, W, H*0.15);
  }

  // ═══════════════════════════════════════════
  // DUST MOTES — tiny particles in sunbeams
  // ═══════════════════════════════════════════
  function updateMotes(dt) {
    for (const m of motes) {
      m.y -= m.rise * dt; m.x += Math.sin(animTime*m.wobble)*0.3;
      if (m.y < H*0.1) { m.y = H*0.4 + Math.random()*H*0.35; m.x = W*0.2 + Math.random()*W*0.6; }
    }
  }
  function drawMotes() { if (!motes.length) return;
    for (const m of motes) {
      ctx.fillStyle = 'rgba(255,250,220,' + m.alpha + ')';
      ctx.beginPath(); ctx.arc(m.x, m.y, 0.8, 0, Math.PI*2); ctx.fill();
    }
  }

  // ═══════════════════════════════════════════
  // REBUILD — create all particle systems
  // ═══════════════════════════════════════════
  function rebuildScene(data) {
    weatherData = data;
    const cond = (data.weatherDesc || '').toLowerCase();
    const overcast = cond.includes('overcast') || cond.includes('cloudy');
    const raining = cond.includes('rain') || cond.includes('drizzle');
    const snowing = cond.includes('snow') || cond.includes('sleet');
    const stormy = cond.includes('thunder');
    const foggy = cond.includes('fog') || cond.includes('mist');
    const cc = data.cloudcover != null ? parseFloat(data.cloudcover) : (overcast ? 90 : 20);
    const ws = parseFloat(data.windspeedMiles) || 5;
    const temp = parseFloat(data.temp_F) || 70;

    // Cirrus clouds — high, thin
    cirrus = []; const nCi = Math.round(cc/15);
    for (let i=0; i<nCi; i++) cirrus.push({
      x:Math.random()*(W+100)-50, y: H*0.05+Math.random()*H*0.15, r:15+Math.random()*25,
      span:80+Math.random()*60, speed:15+Math.random()*10, baseY: H*0.05+Math.random()*H*0.15
    });

    // Cumulus — mid, puffy
    cumulus = []; const nCu = Math.round(cc/5);
    for (let i=0; i<nCu; i++) cumulus.push({
      x:Math.random()*(W+100)-50, y: H*0.12+Math.random()*H*0.25, r:20+Math.random()*35,
      span:70+Math.random()*90, speed:ws*1.5+Math.random()*12, baseY: H*0.12+Math.random()*H*0.25
    });

    // Stratus — low, flat
    stratus = []; const nSt = Math.round(cc/8);
    for (let i=0; i<nSt; i++) stratus.push({
      x:Math.random()*(W+100)-50, y: H*0.3+Math.random()*H*0.2, r:25+Math.random()*40,
      span:100+Math.random()*120, speed:ws+Math.random()*6, baseY: H*0.3+Math.random()*H*0.2
    });

    // Rain
    drops = [];
    if (raining) {
      const n = cond.includes('heavy')?350 : cond.includes('light')||cond.includes('drizzle')?80 : 200;
      for (let i=0; i<n; i++) drops.push({
        x:Math.random()*(W+40)-20, y:Math.random()*H,
        speed:400+Math.random()*350, drift:-20+Math.random()*40, len:10+Math.random()*18
      });
    }

    // Snow
    flakes = [];
    if (snowing) {
      const n = cond.includes('heavy')?150 : 70;
      for (let i=0; i<n; i++) flakes.push({
        x:Math.random()*(W+20)-10, y:Math.random()*H,
        speed:20+Math.random()*45, r:1.5+Math.random()*3.5,
        wobble:1+Math.random()*2.5, alpha:0.35+Math.random()*0.55, phase:Math.random()*10
      });
    }

    // Stars
    stars = [];
    if (!data.isDay) {
      for (let i=0; i<110; i++) stars.push({
        x:Math.random()*W, y:Math.random()*H*0.68,
        r:0.5+Math.random()*2.2, rate:1.5+Math.random()*6,
        phase:Math.random()*10, brightness:0.3+Math.random()*0.7
      });
    }

    // Wind lines
    const windDir = parseInt(data.winddirDegree) || 270;
    const windRad = windDir * Math.PI / 180;
    windLines = [];
    if (ws > 3) {
      const nwl = Math.round(ws * 2);
      for (let i=0; i<nwl; i++) {
        const w = {
          x:Math.random()*W, y:20+Math.random()*(H*0.4),
          speed:ws*8, dir:Math.cos(windRad), vertical:Math.sin(windRad)*ws*2,
          len:25+Math.random()*60, alpha:0.02+Math.random()*0.05
        };
        w.x = w.dir > 0 ? -30 : W+30;
        windLines.push(w);
      }
    }

    // Birds — chance based on conditions
    birds = [];
    if (data.isDay && !raining && !snowing && !stormy && !foggy && cc < 80) {
      const nBirds = 2 + Math.floor(Math.random()*4);
      for (let i=0; i<nBirds; i++) birds.push({
        x:Math.random()*W, y:H*0.08+Math.random()*H*0.25,
        speed:30+Math.random()*40, flapRate:3+Math.random()*4,
        flapPhase:Math.random()*10, alpha:0.3+Math.random()*0.3
      });
    }

    // Dust motes (daytime, sunlit)
    motes = [];
    if (data.isDay && !raining && !snowing && !stormy) {
      for (let i=0; i<50; i++) motes.push({
        x:W*0.2+Math.random()*W*0.6, y:H*0.4+Math.random()*H*0.35,
        rise:2+Math.random()*6, wobble:1+Math.random()*3, alpha:0.03+Math.random()*0.08
      });
    }

    // Shooting stars — occasionally at night
    shootingStars = [];
  }

  // ═══════════════════════════════════════════
  // OVERLAY — temperature + conditions text
  // ═══════════════════════════════════════════
  function updateOverlay(data) {
    document.getElementById('wo-temp').textContent = data.temp_F + '°';
    document.getElementById('wo-desc').textContent = data.weatherDesc;
    document.getElementById('wo-detail').textContent =
      'Feels ' + data.FeelsLikeF + '° · Humidity ' + data.humidity + '% · Wind ' + data.windspeedMiles + ' mph';
  }

  function updateForecast(forecast) {
    const el = document.getElementById('wo-forecast');
    if (!el || !forecast || !forecast.length) return;
    const icons = {'sunny':'☀️','clear':'☀️','partly cloudy':'⛅','cloudy':'☁️','overcast':'☁️',
      'mist':'🌫️','fog':'🌫️','rain':'🌧️','light rain':'🌦️','heavy rain':'🌧️',
      'drizzle':'🌦️','thunder':'⛈️','snow':'🌨️','sleet':'🌨️'};
    el.innerHTML = forecast.slice(0, 8).map(f => {
      const h = parseInt(f.time)/100|0, ap = h>=12?'P':'A', h12 = h%12||12;
      let icon = '🌤️';
      const desc = (f.weatherDesc||'').toLowerCase();
      for (const [k,v] of Object.entries(icons)) if (desc.includes(k)){icon=v; break;}
      return '<div class="wo-fc-item"><div class="wo-fc-hour">'+h12+ap+'</div><div class="wo-fc-icon">'+icon+'</div><div class="wo-fc-temp">'+f.tempF+'°</div></div>';
    }).join('');
  }

  // ═══════════════════════════════════════════
  // WEATHER FETCH
  // ═══════════════════════════════════════════
  async function fetchWeather() {
    try {
      const r = await fetch('https://wttr.in/Palo+Alto?format=j1');
      if (!r.ok) throw Error('HTTP '+r.status);
      const data = await r.json();
      const c = data.current_condition[0];
      const astro = (data.weather&&data.weather[0]&&data.weather[0].astronomy) ? data.weather[0].astronomy[0] : null;
      const now = new Date();
      let isDay = true, sr = null, ss = null, nm = null;
      if (astro) {
        function parseTime(t) {
          const parts = t.replace(/[AP]M/i,'').trim().split(':');
          let h = parseInt(parts[0]), m = parseInt(parts[1]);
          if (/PM/i.test(t) && h !== 12) h += 12;
          if (/AM/i.test(t) && h === 12) h = 0;
          return h*60 + m;
        }
        sr = parseTime(astro.sunrise); ss = parseTime(astro.sunset);
        nm = now.getHours()*60 + now.getMinutes();
        isDay = nm>=sr && nm<ss;
      }
      const wd = {
        temp_F: c.temp_F, FeelsLikeF: c.FeelsLikeF, humidity: c.humidity,
        weatherDesc: c.weatherDesc[0].value, windspeedMiles: c.windspeedMiles,
        winddirDegree: c.winddirDegree, cloudcover: c.cloudcover,
        visibility: c.visibility, isDay: isDay,
        srMins: sr, ssMins: ss, nowMins: nm
      };
      rebuildScene(wd); updateOverlay(wd);
      window.__wttr = wd; if (window.onWeather) window.onWeather(wd);

      // Also fetch AQI
      fetchAQI();

      if (data.weather) {
        const nowHr = now.getHours();
        const hourly = data.weather[0].hourly||[];
        const future = hourly.filter(f=>(parseInt(f.time)/100|0)>nowHr);
        let fc = future.slice(0, 8);
        if (fc.length<5 && data.weather[1]) fc = fc.concat(data.weather[1].hourly.filter(f=>(parseInt(f.time)/100|0)<12)).slice(0,8);
        updateForecast(fc);
      }
    } catch(e) {
      console.warn('Weather:', e.message);
      if (!weatherData) rebuildScene({cloudcover:30,weatherDesc:'Clear',temp_F:72,isDay:true,FeelsLikeF:75,humidity:50,windspeedMiles:5,winddirDegree:270});
    }
  }

  // ═══════════════════════════════════════════
  // AQI FETCH
  // ═══════════════════════════════════════════
  async function fetchAQI() {
    try {
      const r = await fetch('https://air-quality-api.open-meteo.com/v1/air-quality?latitude=37.44&longitude=-122.14&current=us_aqi,pm2_5,pm10&timezone=America/Los_Angeles');
      if (!r.ok) return;
      const d = await r.json();
      aqiData = d.current;
      window.__aqi = aqiData; if (window.onAqi) window.onAqi(aqiData);
      // Update display
      const aqi = aqiData.us_aqi;
      const dot = document.getElementById('aqi-dot');
      const txt = document.getElementById('aqi-text');
      if (dot && txt) {
        txt.textContent = 'AQI ' + aqi;
        if (aqi <= 50) dot.style.background = '#4caf50';
        else if (aqi <= 100) dot.style.background = '#ffc107';
        else if (aqi <= 150) dot.style.background = '#ff9800';
        else if (aqi <= 200) dot.style.background = '#f44336';
        else dot.style.background = '#8e24aa';
      }
    } catch(e) { console.warn('AQI:', e.message); }
  }

  // ═══════════════════════════════════════════
  // ANIMATION LOOP — the heart of the scene
  // ═══════════════════════════════════════════
  let lastTime = 0;
  function animate(ts) {
    const dt = lastTime ? Math.min((ts-lastTime)/1000, 0.1) : 0.016;
    lastTime = ts; animTime += dt;

    ctx.clearRect(0,0,W,H);

    // Layer 1: Sky
    drawSky();

    // Layer 2: Aurora (night)
    drawAurora();

    // Layer 3: Stars + shooting stars (night)
    drawStars();
    drawShootingStars();

    // Layer 4: Sun/Moon
    drawSun();
    drawMoon();

    // Layer 5: High cirrus
    updateClouds(dt); drawCloudLayer(cirrus, weatherData&&!weatherData.isDay?'#666':'#fff', weatherData&&!weatherData.isDay?0.10:0.22);

    // Layer 6: Mid cumulus
    drawCloudLayer(cumulus, weatherData&&!weatherData.isDay?'#555':'#fff', weatherData&&!weatherData.isDay?0.15:0.35);

    // Layer 7: Birds
    updateBirds(dt); drawBirds();

    // Layer 8: Rainbow
    drawRainbow();

    // Layer 9: Wind
    updateWind(dt); drawWind();

    // Layer 10: Precipitation
    if (drops.length) { updateRain(dt); drawRain(); }
    if (flakes.length) { updateSnow(dt); drawSnow(); }

    // Layer 11: Lightning
    drawLightning();

    // Layer 12: Low stratus
    drawCloudLayer(stratus, weatherData&&!weatherData.isDay?'#444':'#ddd', weatherData&&!weatherData.isDay?0.22:0.50);

    // Layer 13: Dust motes
    updateMotes(dt); drawMotes();

    // Layer 14: Heat shimmer
    drawHeatShimmer();

    // Layer 15: Horizon + water
    drawHorizon();

    // Spawn new lightning on random interval (stormy only)
    const d = weatherData || {};
    if ((d.weatherDesc||'').toLowerCase().includes('thunder') && Math.random() < 0.008) {
      lightningBolts.push({
        x: W*0.3+Math.random()*W*0.4, y: H*0.02,
        segments: 4+Math.floor(Math.random()*6), segLen: 15+Math.random()*30,
        life: 0.3+Math.random()*0.5, born: animTime
      });
    }

    // Spawn shooting stars (night)
    if (!d.isDay && Math.random() < 0.003 && shootingStars.length < 2) {
      shootingStars.push({
        x: W*0.2+Math.random()*W*0.6, y: H*0.05+Math.random()*H*0.3,
        dx: 80+Math.random()*120, dy: 30+Math.random()*60,
        life: 0.5+Math.random()*0.8, born: animTime
      });
    }

    requestAnimationFrame(animate);
  }

  // ═══════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════
  window.addEventListener('resize', resize);
  resize();
  fetchWeather();
  setInterval(fetchWeather, 5*60*1000);
  requestAnimationFrame(animate);
} catch(e) { console.warn('Weather window:', e.message); }
})();

</script>
