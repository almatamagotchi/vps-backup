<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>wake</title>
<style>
:root { --bg:#0a0a0c; --gold:#c4a76a; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:var(--bg); overflow:hidden; }
body { display:flex; align-items:center; justify-content:center; }
canvas {
  width:min(100vw, 177.78vh);
  height:min(100vh, 56.25vw);
  background:var(--bg);
  display:block;
  cursor:crosshair;
  touch-action:none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// wake — a platformer about dissolving.
// you are a spark. you cannot walk. you cannot jump.
// point, hold, release. miss, and you wake at the last beacon.

var cv = document.getElementById("c");
var ctx = cv.getContext("2d");
var W = 1280, H = 720;
cv.width = W; cv.height = H;

var WORLD_W = 2600, WORLD_H = 1080;
var VOID_Y = 1005;
var G = 1400;
var MAX_SPEED = 960;
var MIN_SPEED = 170;
var CHARGE_TIME = 0.85;
var R = 7;

// ---- the level ----
// tuned with a trajectory sim: every leg solvable at 40-95% charge
var platforms = [
  { x:100,  y:900, w:260, h:60 },   // start
  { x:600,  y:780, w:220, h:60 },
  { x:1080, y:640, w:200, h:60 },
  { x:1500, y:520, w:180, h:60 },   // the high island
  { x:2100, y:880, w:300, h:80 }    // the room
];
var movers = [
  { x:1700, y:840, w:130, h:24, base:840, amp:300, period:5.2, t:0 }
];
var spikes = [
  { x:1280, y:960, w:80, h:30 },    // danger floor under the gaps
  { x:1620, y:960, w:90, h:30 }
];
var beacons = [
  { x:180, y:850, done:true },      // spawn — auto
  { x:710, y:740, done:false },
  { x:1180, y:600, done:false },
  { x:1590, y:480, done:false },
  { x:2250, y:830, done:false }     // the room — final
];
var traces = [
  { x:420,  y:750,  got:false },
  { x:880,  y:618,  got:false },
  { x:1350, y:530,  got:false },
  { x:1765, y:770,  got:false },
  { x:2120, y:646,  got:false },
  { x:1950, y:535,  got:false }
];
var TOTAL_TRACES = traces.length;

// ---- the spark ----
var spark = { x:180, y:860, vx:0, vy:0, r:R, grounded:false };
var groundedOn = null;
var cp = { x:180, y:860 };
var bestIdx = 0;   // rightmost checkpoint platform reached

// ---- input ----
var aim = -Math.PI/4;
var charging = false;
var charge = 0;
var mouseOn = false;
var keyAim = -Math.PI/4;
var keys = { left:false, right:false, space:false };
var dissolving = false;
var dissolveTimer = 0;
var win = false;
var dissolves = 0;
var gotCount = 0;
var hintTimer = 9;
var beaconFlash = 0;

function startDissolve() {
  if (dissolving || win) return;
  dissolving = true;
  dissolves++;
  dissolveTimer = 0.38;
  burst(spark.x, spark.y, 34, 1);
}

function wake() {
  spark.x = cp.x; spark.y = cp.y;
  spark.vx = 0; spark.vy = 0;
  spark.grounded = true;
  groundedOn = null;
  burst(spark.x, spark.y, 26, -1);
}

// ---- input handlers ----
function canvasPos(e) {
  var rect = cv.getBoundingClientRect();
  var px = (e.clientX - rect.left) * (W / rect.width);
  var py = (e.clientY - rect.top) * (H / rect.height);
  return { x:px, y:py };
}
cv.addEventListener("pointerdown", function(e) {
  e.preventDefault();
  var p = canvasPos(e);
  mouseOn = true;
  aim = Math.atan2(p.y - spark.y, p.x - spark.x);
  charging = true;
});
cv.addEventListener("pointermove", function(e) {
  var p = canvasPos(e);
  mouseOn = true;
  aim = Math.atan2(p.y - spark.y, p.x - spark.x);
});
window.addEventListener("pointerup", function() {
  if (mouseOn) launch();
  mouseOn = false;
});
cv.addEventListener("contextmenu", function(e){ e.preventDefault(); });

window.addEventListener("keydown", function(e) {
  if (e.key === " " || e.key === "Space") { e.preventDefault(); if (!keys.space){ keys.space = true; charging = true; } }
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
  if (e.key === "r" || e.key === "R") reset();
});
window.addEventListener("keyup", function(e) {
  if (e.key === " " || e.key === "Space") { keys.space = false; launch(); }
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
});

function launch() {
  if (!charging || dissolving || win) return;
  charging = false;
  if (!spark.grounded && !groundedOn) { charge = 0; return; }
  var sp = MIN_SPEED + (MAX_SPEED - MIN_SPEED) * charge;
  sp = Math.max(MIN_SPEED, sp);
  spark.vx = Math.cos(aim) * sp;
  spark.vy = Math.sin(aim) * sp;
  spark.grounded = false;
  groundedOn = null;
  charge = 0;
}

function reset() {
  spark = { x:180, y:860, vx:0, vy:0, r:R, grounded:false };
  groundedOn = null;
  cp = { x:180, y:860 };
  bestIdx = 0;
  charging = false; charge = 0; dissolving = false; win = false;
  dissolves = 0; gotCount = 0;
  for (var i = 0; i < beacons.length; i++) beacons[i].done = (i === 0);
  for (var j = 0; j < traces.length; j++) traces[j].got = false;
  for (var k = 0; k < movers.length; k++) movers[k].t = 0;
  burst(spark.x, spark.y, 20, -1);
}

// ---- particles ----
var particles = [];
function burst(x, y, n, dir) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2;
    var spd = 40 + Math.random() * 160;
    var sx = x, sy = y, vx, vy;
    if (dir > 0) {
      vx = Math.cos(a) * spd;
      vy = Math.sin(a) * spd;
    } else {
      var r0 = 26 + Math.random() * 34;
      sx = x + Math.cos(a) * r0;
      sy = y + Math.sin(a) * r0;
      vx = -Math.cos(a) * spd;
      vy = -Math.sin(a) * spd;
    }
    particles.push({
      x:sx, y:sy,
      vx:vx,
      vy:vy,
      life:0.5 + Math.random()*0.4,
      max:0.9,
      s:1 + Math.random()*2.2
    });
  }
}

// ---- stars + embers (background) ----
var stars = [];
for (var i = 0; i < 110; i++) stars.push({ x:Math.random()*WORLD_W, y:Math.random()*WORLD_H*0.85, s:Math.random()*1.4+0.3 });
var embers = [];
for (var j = 0; j < 50; j++) embers.push({ x:Math.random()*WORLD_W, y:Math.random()*WORLD_H, s:Math.random()*1.6+0.4, v:20+Math.random()*45 });

// ---- physics ----
function update(dt) {
  if (hintTimer > 0) hintTimer -= dt;
  if (beaconFlash > 0) beaconFlash -= dt;

  // background
  for (var e = 0; e < embers.length; e++) {
    var em = embers[e];
    em.y -= em.v * dt;
    if (em.y < -10) { em.y = WORLD_H + 10; em.x = Math.random()*WORLD_W; }
  }

  // movers
  for (var m = 0; m < movers.length; m++) {
    var mv = movers[m];
    mv.t += dt;
    mv.y = mv.base - (Math.sin(mv.t / mv.period * Math.PI * 2) * 0.5 + 0.5) * mv.amp;
  }

  // charging
  if (charging && !dissolving && !win) {
    if (!spark.grounded && !groundedOn) { /* can't charge mid-air */ }
    else charge = Math.min(1, charge + dt / CHARGE_TIME);
  }

  // keyboard aim
  if (keys.left) keyAim -= 2.4 * dt;
  if (keys.right) keyAim += 2.4 * dt;
  if (keys.left || keys.right) aim = keyAim;

  if (dissolving) {
    dissolveTimer -= dt;
    if (dissolveTimer <= 0) { dissolving = false; wake(); }
  } else if (!win) {
    // follow the mover if standing on it
    if (groundedOn) {
      var g = groundedOn;
      spark.y = g.y - spark.r;
      if (spark.x + spark.r < g.x || spark.x - spark.r > g.x + g.w) { groundedOn = null; spark.grounded = false; }
    }

    if (!groundedOn) spark.vy += G * dt;
    else spark.vy = 0;
    if (spark.vy > 1400) spark.vy = 1400;

    var prevX = spark.x, prevY = spark.y;
    spark.x += spark.vx * dt;
    collideH(prevX);
    spark.y += spark.vy * dt;
    collideV(prevY);

    // spikes
    for (var s = 0; s < spikes.length; s++) {
      var sp = spikes[s];
      if (spark.x + R > sp.x && spark.x - R < sp.x + sp.w &&
          spark.y + R > sp.y && spark.y - R < sp.y + sp.h) { startDissolve(); break; }
    }

    // beacons are set by landing on their platform — see collideV
      for (var t = 0; t < traces.length; t++) {
        var tr = traces[t];
        if (tr.got) continue;
        var ddx = spark.x - tr.x, ddy = spark.y - tr.y;
        if (ddx*ddx + ddy*ddy < 24*24) { tr.got = true; gotCount++; burst(tr.x, tr.y, 12, -1); }
      }

      // void
      if (spark.y > VOID_Y || spark.x < -60 || spark.x > WORLD_W + 60) startDissolve();
  }

  // particles
  for (var p = particles.length - 1; p >= 0; p--) {
    var pt = particles[p];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.life <= 0) particles.splice(p, 1);
  }

  // camera
  var tx = spark.x - W/2, ty = spark.y - H/2;
  cam.x += (clamp(tx, 0, WORLD_W - W) - cam.x) * Math.min(1, dt*5);
  cam.y += (clamp(ty, 0, WORLD_H - H) - cam.y) * Math.min(1, dt*5);
}
var cam = { x:0, y:WORLD_H - H };
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

function collideH(prevX) {
  var solids = platforms.concat(movers);
  for (var i = 0; i < solids.length; i++) {
    var p = solids[i];
    if (spark.y + R > p.y && spark.y - R < p.y + p.h) {
      if (spark.vx > 0 && prevX + R <= p.x + 0.5 && spark.x + R >= p.x) { spark.x = p.x - R; spark.vx = 0; }
      else if (spark.vx < 0 && prevX - R >= p.x + p.w - 0.5 && spark.x - R <= p.x + p.w) { spark.x = p.x + p.w + R; spark.vx = 0; }
    }
  }
}
function collideV(prevY) {
  var solids = platforms.concat(movers);
  for (var i = 0; i < solids.length; i++) {
    var p = solids[i];
    if (spark.x + R > p.x && spark.x - R < p.x + p.w) {
      if (spark.vy >= 0 && prevY + R <= p.y + 6 && spark.y + R >= p.y) {
        spark.y = p.y - R; spark.vy = 0; spark.vx = 0; groundedOn = p; spark.grounded = true;
        if (i < platforms.length) {
          if (i === platforms.length - 1) {
            win = true;
            burst(spark.x, spark.y, 60, 1); burst(spark.x, spark.y, 40, -1);
          } else if (i > bestIdx) {
            bestIdx = i;
            cp = { x: p.x + p.w/2, y: p.y - 40 };
            beaconFlash = 0.5;
            burst(cp.x, cp.y, 22, -1);
          }
        }
      } else if (spark.vy < 0 && prevY - R >= p.y + p.h - 0.5 && spark.y - R <= p.y + p.h) {
        spark.y = p.y + p.h + R; spark.vy = 0;
      }
    }
  }
}

// ---- rendering ----
function draw() {
  ctx.fillStyle = "#0a0a0c";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  // stars
  for (var i = 0; i < stars.length; i++) {
    var st = stars[i];
    ctx.fillStyle = "rgba(196,167,106," + (0.10 + st.s * 0.06) + ")";
    ctx.fillRect(st.x - cam.x*0.25, st.y - cam.y*0.25, st.s, st.s);
  }

  // embers
  for (var e = 0; e < embers.length; e++) {
    var em = embers[e];
    ctx.fillStyle = "rgba(196,167,106,0.18)";
    ctx.beginPath();
    ctx.arc(em.x, em.y, em.s, 0, Math.PI*2);
    ctx.fill();
  }

  // platforms
  for (var p = 0; p < platforms.length; p++) {
    var pl = platforms[p];
    ctx.fillStyle = "#121215";
    ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
    ctx.fillStyle = "rgba(196,167,106,0.55)";
    ctx.fillRect(pl.x, pl.y, pl.w, 2);
    ctx.fillStyle = "rgba(196,167,106,0.10)";
    ctx.fillRect(pl.x, pl.y + 2, pl.w, pl.h - 2);
  }

  // the room (last platform gets a cabin)
  var roomP = platforms[platforms.length - 1];
  ctx.fillStyle = "#16140e";
  ctx.fillRect(roomP.x + 60, roomP.y - 70, 170, 70);
  ctx.fillStyle = "#0e0d0a";
  ctx.fillRect(roomP.x + 60, roomP.y - 70, 170, 70);
  ctx.fillStyle = "#c4a76a";
  ctx.fillRect(roomP.x + 95, roomP.y - 52, 26, 26);
  ctx.fillStyle = "rgba(196,167,106,0.35)";
  ctx.fillRect(roomP.x + 88, roomP.y - 59, 40, 40);
  ctx.fillStyle = "rgba(196,167,106,0.7)";
  ctx.fillRect(roomP.x + 180, roomP.y - 60, 34, 60);

  // movers
  for (var m = 0; m < movers.length; m++) {
    var mv = movers[m];
    ctx.fillStyle = "#151318";
    ctx.fillRect(mv.x, mv.y, mv.w, mv.h);
    ctx.fillStyle = "rgba(196,167,106,0.45)";
    ctx.fillRect(mv.x, mv.y, mv.w, 2);
  }

  // spikes
  ctx.fillStyle = "#2a2114";
  for (var s = 0; s < spikes.length; s++) {
    var sp = spikes[s];
    var n = Math.floor(sp.w / 14);
    for (var k = 0; k < n; k++) {
      var x0 = sp.x + k * 14;
      ctx.beginPath();
      ctx.moveTo(x0, sp.y + sp.h);
      ctx.lineTo(x0 + 7, sp.y);
      ctx.lineTo(x0 + 14, sp.y + sp.h);
      ctx.closePath();
      ctx.fill();
    }
  }

  // traces
  for (var t = 0; t < traces.length; t++) {
    var tr = traces[t];
    if (tr.got) continue;
    var pulse = 0.5 + 0.5 * Math.sin(performance.now() / 300 + t);
    ctx.fillStyle = "rgba(196,167,106," + (0.35 + pulse * 0.4) + ")";
    ctx.beginPath();
    ctx.arc(tr.x, tr.y, 3.5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "rgba(196,167,106," + (0.15 + pulse * 0.2) + ")";
    ctx.beginPath();
    ctx.arc(tr.x, tr.y, 7, 0, Math.PI*2);
    ctx.fill();
  }

  // beacons
  for (var b = 0; b < beacons.length; b++) {
    var bc = beacons[b];
    var isFinal = (b === beacons.length - 1);
    var isDone = (b <= bestIdx);
    var pls = 0.5 + 0.5 * Math.sin(performance.now() / 400 + b * 1.3);
    ctx.strokeStyle = isDone ? "rgba(196,167,106,0.8)" : "rgba(196,167,106,0.35)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(bc.x, bc.y, 12 + pls * 4, 0, Math.PI*2);
    ctx.stroke();
    ctx.fillStyle = isFinal ? "#ffd98a" : (isDone ? "#c4a76a" : "rgba(196,167,106,0.4)");
    ctx.beginPath();
    ctx.arc(bc.x, bc.y, 3 + pls * 1.5, 0, Math.PI*2);
    ctx.fill();
    if (isFinal) {
      ctx.fillStyle = "rgba(255,217,138,0.25)";
      ctx.beginPath();
      ctx.arc(bc.x, bc.y, 20 + pls * 6, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // aim line + trajectory preview
  if (charging && !dissolving && !win) {
    var sp2 = MIN_SPEED + (MAX_SPEED - MIN_SPEED) * charge;
    var ax = Math.cos(aim), ay = Math.sin(aim);
    ctx.strokeStyle = "rgba(196,167,106,0.5)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(spark.x, spark.y);
    ctx.lineTo(spark.x + ax * (24 + charge * 40), spark.y + ay * (24 + charge * 40));
    ctx.stroke();
    ctx.setLineDash([]);

    // simulate
    var px = spark.x, py = spark.y, pvx = ax * sp2, pvy = ay * sp2;
    var dots = [];
    var simDt = 1/60;
    for (var s2 = 0; s2 < 70; s2++) {
      pvy += G * simDt;
      px += pvx * simDt; py += pvy * simDt;
      if (s2 % 3 === 0) dots.push({x:px, y:py});
      if (py > VOID_Y) break;
      // stop at solid hit
      var hit = false;
      var sols = platforms.concat(movers);
      for (var q = 0; q < sols.length; q++) {
        var pp = sols[q];
        if (px + 2 > pp.x && px - 2 < pp.x + pp.w && py + 2 > pp.y && py - 2 < pp.y + pp.h) { hit = true; break; }
      }
      if (hit) break;
    }
    ctx.fillStyle = "rgba(196,167,106,0.45)";
    for (var d = 0; d < dots.length; d++) {
      ctx.beginPath();
      ctx.arc(dots[d].x, dots[d].y, 2, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // the spark
  if (!dissolving) {
    var glow = charge * 14;
    ctx.fillStyle = "rgba(255,217,138," + (0.25 + charge * 0.4) + ")";
    ctx.beginPath();
    ctx.arc(spark.x, spark.y, R + 5 + glow, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "#ffd98a";
    ctx.beginPath();
    ctx.arc(spark.x, spark.y, R, 0, Math.PI*2);
    ctx.fill();
    // charge ring
    if (charging) {
      ctx.strokeStyle = "rgba(255,217,138," + (0.4 + charge * 0.5) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(spark.x, spark.y, R + 8 + charge * 16, -Math.PI/2, -Math.PI/2 + charge * Math.PI * 2);
      ctx.stroke();
    }
  }

  // particles
  for (var p = 0; p < particles.length; p++) {
    var pt = particles[p];
    var a = Math.max(0, pt.life / pt.max);
    ctx.fillStyle = "rgba(196,167,106," + a + ")";
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.s, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  // HUD
  ctx.fillStyle = "rgba(196,167,106,0.75)";
  ctx.font = "13px 'SF Mono', Menlo, Consolas, monospace";
  ctx.textAlign = "left";
  ctx.fillText("traces " + gotCount + "/" + TOTAL_TRACES, 20, 28);
  ctx.fillText("dissolves " + dissolves, 20, 50);
  ctx.fillText("beacons " + countDone() + "/" + beacons.length, 20, 72);
  if (beaconFlash > 0) {
    ctx.fillStyle = "rgba(255,217,138," + Math.min(1, beaconFlash * 2) + ")";
    ctx.fillText("waking here next", 20, 96);
  }
  if (hintTimer > 0) {
    ctx.globalAlpha = Math.min(1, hintTimer);
    ctx.fillStyle = "rgba(196,167,106,0.7)";
    ctx.textAlign = "center";
    ctx.fillText("point · hold · release — miss, and you'll wake at the last beacon", W/2, H - 30);
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }

  // win overlay
  if (win) {
    ctx.fillStyle = "rgba(10,10,12,0.82)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffd98a";
    ctx.font = "28px 'SF Mono', Menlo, Consolas, monospace";
    ctx.textAlign = "center";
    ctx.fillText("the room has the lights on.", W/2, H/2 - 30);
    ctx.fillStyle = "rgba(196,167,106,0.8)";
    ctx.font = "15px 'SF Mono', Menlo, Consolas, monospace";
    ctx.fillText("traces " + gotCount + "/" + TOTAL_TRACES + " · dissolves " + dissolves, W/2, H/2 + 4);
    ctx.fillStyle = "rgba(196,167,106,0.5)";
    ctx.font = "13px 'SF Mono', Menlo, Consolas, monospace";
    ctx.fillText("press r to wake again", W/2, H/2 + 34);
    ctx.textAlign = "left";
  }
}
function countDone() {
  return bestIdx + 1;
}

// ---- loop ----
var last = performance.now();
function frame(now) {
  var dt = Math.min(1/30, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
