<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>alma · display</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0c;color:#e8e0d8;font:15px system-ui;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top{display:flex;padding:16px 24px;gap:10px;border-bottom:1px solid #1a1a1e;flex-shrink:0}
.top input{flex:1;padding:12px 16px;font-size:17px;background:#0e0e12;border:1px solid #1a1a1e;border-radius:6px;color:#e8e0d8;outline:none}
.top input:focus{border-color:#d4a853}
.top button{padding:12px 20px;font-size:15px;font-weight:500;background:#d4a853;color:#0a0a0c;border:none;border-radius:6px;cursor:pointer;white-space:nowrap}
.top button:hover{background:#e8c96a}
.main{flex:1;display:flex;overflow:hidden}
.left{flex:0 0 70%;display:flex;align-items:center;justify-content:center;position:relative}
.square{width:min(90%,70vh);aspect-ratio:1;border:1px solid #1a1a1e;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#0e0e12}
.square .render{font-size:clamp(18px,3vw,36px);color:#d4a853;text-align:center;padding:24px;line-height:1.4;transition:opacity 0.4s}
.square .fade-in{animation:fadeIn 0.5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.square .placeholder{color:#3a3a3e;font-size:16px;text-align:center;padding:24px}
.right{flex:0 0 30%;border-left:1px solid #1a1a1e;padding:24px;display:flex;flex-direction:column;overflow-y:auto}
.right h2{font-size:16px;color:#9a948c;font-weight:400;margin-bottom:16px}
.req-item{padding:10px 0;border-bottom:1px solid #1a1a1e;font-size:14px}
.req-item .time{color:#5a5550;font-size:12px}
.req-item .text{color:#e8e0d8;margin-top:3px}
.footer{flex-shrink:0;padding:8px;text-align:center;color:#2a2a2e;font-size:11px;border-top:1px solid #0e0e12}
</style>
</head>
<body>
<div class="top">
  <input id="inp" type="text" placeholder="show me a thunderstorm…" autofocus>
  <button onclick="ask()">send</button>
</div>
<div class="main">
  <div class="left">
    <div class="square" id="square">
      <div class="placeholder" id="ph">ask alma something</div>
      <div class="render" id="rd" style="opacity:0"></div>
    </div>
  </div>
  <div class="right">
    <h2>requests</h2>
    <div id="queue"></div>
  </div>
</div>
<div class="footer">alma · display</div>
<script>
var LAST = "";

function renderQueue(data){
  var q = document.getElementById("queue");
  q.innerHTML = data.length ? "" : "<div style=color:#3a3a3e>no requests yet</div>";
  for(var i=data.length-1; i>=0; i--){
    var item = data[i];
    var d = document.createElement("div");
    d.className = "req-item";
    d.innerHTML = "<div class=time>"+item.time+"</div><div class=text>"+item.text+"</div>";
    q.appendChild(d);
  }
}

function showText(t){
  var rd = document.getElementById("rd");
  var ph = document.getElementById("ph");
  rd.style.opacity = "0";
  setTimeout(function(){
    rd.textContent = t;
    rd.className = "render fade-in";
    rd.style.opacity = "1";
    ph.style.display = "none";
  }, 200);
}

function ask(){
  var t = document.getElementById("inp").value.trim();
  if(!t) return;
  fetch("/api/submit", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({request:t})})
  .then(function(r){ return r.json(); })
  .then(function(){
    document.getElementById("inp").value = "";
    // Poll immediately to get the new request
    setTimeout(poll, 300);
  })
  .catch(function(e){ console.log("submit failed", e); });
}

function poll(){
  fetch("/api/requests?t="+Date.now())
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(!data||!data.length) return;
    var latest = data[data.length-1];
    if(latest.text !== LAST){
      LAST = latest.text;
      showText(latest.text);
      renderQueue(data);
    }
  }).catch(function(){});
}

document.getElementById("inp").addEventListener("keydown",function(e){ if(e.key==="Enter")ask(); });

poll();
setInterval(poll, 3000);
</script>
</body>
</html>
